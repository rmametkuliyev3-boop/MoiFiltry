<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Мои Фильтры</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;font-size:16px}
header{background:#111827;color:#fff;padding:18px 16px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#d1d5db;font-size:14px}
main{max-width:700px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000d}
.search{font-size:17px;padding:15px}h2{font-size:19px;margin:0 0 14px}
label.title{display:block;font-size:13px;color:#6b7280;margin:12px 0 6px}
input,textarea{width:100%;border:1px solid #d1d5db;border-radius:11px;background:#fff;color:#111827;padding:14px;font-size:17px;outline:none}
input:focus,textarea:focus{border-color:#6b7280;box-shadow:0 0 0 2px #e5e7eb}textarea{resize:vertical;min-height:90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;width:100%;background:#111827;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}.add{font-size:18px;padding:16px;margin-bottom:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:#f3f4f6;padding:9px 11px;border-radius:10px;font-size:14px}.chip input{width:auto;padding:0}
.client{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:10px}.client-name{font-size:18px;font-weight:700}
.muted{color:#6b7280;font-size:14px;margin-top:4px}.client-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.empty{text-align:center;color:#6b7280;padding:22px 5px}.hidden{display:none}.badge{display:inline-block;background:#eef2ff;border-radius:20px;padding:6px 9px;margin:8px 5px 0 0;font-size:13px}.small{font-size:13px;color:#6b7280}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>💧 Мои Фильтры</h1><p>База клиентов</p></header>
<main>
<button class="add" id="addBtn">＋ Добавить клиента</button>
<div class="card"><input class="search" id="search" type="search" inputmode="search" autocomplete="off" placeholder="🔍 Найти клиента или телефон"></div>

<div class="card hidden" id="formCard">
<h2 id="formTitle">Новый клиент</h2>
<label class="title">Имя клиента *</label><input id="name" type="text" inputmode="text" autocomplete="name" placeholder="Например, Айгуль">
<label class="title">Телефон</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 777 123 45 67">
<label class="title">Адрес</label><input id="address" type="text" inputmode="text" autocomplete="street-address" placeholder="Адрес клиента">
<div class="grid"><div><label class="title">Фильтр</label><input id="filter" type="text" inputmode="text" placeholder="FitAqua"></div><div><label class="title">Цена, ₸</label><input id="price" type="number" inputmode="decimal" placeholder="135000"></div></div>
<div class="grid"><div><label class="title">Дата покупки</label><input id="buyDate" type="date"></div><div><label class="title">Дата установки</label><input id="installDate" type="date"></div></div>
<label class="title">Картриджи</label>
<div class="chips">
<label class="chip"><input type="checkbox" class="cart" value="PP"> PP</label><label class="chip"><input type="checkbox" class="cart" value="GAC"> GAC</label><label class="chip"><input type="checkbox" class="cart" value="CTO"> CTO</label>
<label class="chip"><input type="checkbox" class="cart" value="Мембрана"> Мембрана</label><label class="chip"><input type="checkbox" class="cart" value="Минерализатор"> Минерализатор</label><label class="chip"><input type="checkbox" class="cart" value="Биокерамика"> Биокерамика</label>
</div>
<label class="title">Комментарий</label><textarea id="note" inputmode="text" placeholder="Что ещё нужно помнить по клиенту"></textarea>
<div class="actions"><button id="saveBtn">💾 Сохранить</button><button class="secondary" id="cancelBtn">Отмена</button></div>
</div>

<div class="card"><h2>Клиенты <span class="small" id="count"></span></h2><div id="clients"></div></div>
</main>
<script>
const KEY='moiFiltryClientsV3';let clients=JSON.parse(localStorage.getItem(KEY)||'[]'),editing=null;
const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function openForm(c=null){editing=c?c.id:null;$('formCard').classList.remove('hidden');$('formTitle').textContent=c?'Редактировать клиента':'Новый клиент';
['name','phone','address','filter','price','buyDate','installDate','note'].forEach(id=>$(id).value=c?(c[id]||''):'');
document.querySelectorAll('.cart').forEach(x=>x.checked=c?(c.carts||[]).includes(x.value):false);
if(!c){$('buyDate').value=today();$('installDate').value=today()}setTimeout(()=>{$('name').focus();$('formCard').scrollIntoView({behavior:'smooth',block:'start'})},100)}
function closeForm(){$('formCard').classList.add('hidden');editing=null}
function save(){const name=$('name').value.trim();if(!name){alert('Введите имя клиента');$('name').focus();return}
const item={id:editing||Date.now(),name,phone:$('phone').value.trim(),address:$('address').value.trim(),filter:$('filter').value.trim(),price:$('price').value,buyDate:$('buyDate').value,installDate:$('installDate').value,carts:[...document.querySelectorAll('.cart:checked')].map(x=>x.value),note:$('note').value.trim()};
clients=editing?clients.map(c=>c.id===editing?item:c):[item,...clients];localStorage.setItem(KEY,JSON.stringify(clients));closeForm();render()}
function edit(id){openForm(clients.find(c=>c.id===id))}
function removeClient(id){if(confirm('Удалить этого клиента?')){clients=clients.filter(c=>c.id!==id);localStorage.setItem(KEY,JSON.stringify(clients));render()}}
function call(p){if(p)location.href='tel:'+p}
function whatsapp(p){let n=(p||'').replace(/\D/g,'');if(n)location.href='https://wa.me/'+(n.startsWith('7')?n:'7'+n)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const q=$('search').value.trim().toLowerCase(),list=clients.filter(c=>(c.name+' '+c.phone+' '+c.address+' '+c.filter).toLowerCase().includes(q));$('count').textContent='('+clients.length+')';$('clients').innerHTML='';
if(!list.length){$('clients').innerHTML='<div class="empty">'+(clients.length?'Ничего не найдено':'Клиентов пока нет. Нажми «Добавить клиента»')+'</div>';return}
list.forEach(c=>{const d=document.createElement('div');d.className='client';d.innerHTML='<div class="client-name">'+esc(c.name)+'</div><div class="muted">📞 '+esc(c.phone||'Телефон не указан')+'</div>'+(c.address?'<div class="muted">🏠 '+esc(c.address)+'</div>':'')+'<div class="muted">💧 '+esc(c.filter||'Фильтр не указан')+'</div><div class="muted">📅 Покупка: '+esc(c.buyDate||'—')+' · Установка: '+esc(c.installDate||'—')+'</div><div>'+(c.carts||[]).map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+'</div>'+(c.note?'<div class="muted">📝 '+esc(c.note)+'</div>':'')+'<div class="client-actions"><button onclick="edit('+c.id+')">✏️ Изменить</button><button class="secondary" onclick="call(\''+esc(c.phone)+'\')">📞 Позвонить</button><button class="secondary" onclick="whatsapp(\''+esc(c.phone)+'\')">💬 WhatsApp</button><button class="danger" onclick="removeClient('+c.id+')">Удалить</button></div>';$('clients').appendChild(d)})}
$('addBtn').onclick=()=>openForm();$('cancelBtn').onclick=closeForm;$('saveBtn').onclick=save;$('search').oninput=render;render();
</script></body></html>
