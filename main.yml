name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка MoiFiltry APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить проект
        shell: bash
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          grep -Eq "applicationId[[:space:]]+['"]kz\.moifiltry\.app\.v67['"]" app/build.gradle
          grep -Eq "versionCode[[:space:]]+19" app/build.gradle
          grep -Eq "versionName[[:space:]]+['"]6\.7['"]" app/build.gradle
          grep -Fq 'addressExtra' app/src/main/assets/index.html
          grep -Fq 'История обслуживания' app/src/main/assets/index.html
          grep -Fq 'function completeTask' app/src/main/assets/index.html
          grep -Fq 'function replacementBaseDate' app/src/main/assets/index.html
          echo "Project and requested logic checks OK"

      - name: Собрать APK
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Подготовить APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" MoiFiltry_01.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_01
          path: MoiFiltry_01.apk
          if-no-files-found: error
          retention-days: 7
