name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android project
        run: |
          set -e

          if [ -f "settings.gradle" ]; then
            PROJECT_ROOT="$PWD"
          else
            ZIP_FILE=$(find . -type f -name "*.zip" ! -path "./.git/*" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Project ZIP not found"
              exit 1
            fi

            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_ROOT=$(find extracted -type f -name "settings.gradle" -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_ROOT" ]; then
              echo "ERROR: settings.gradle not found"
              exit 1
            fi
          fi

          test -f "$PROJECT_ROOT/settings.gradle"
          test -f "$PROJECT_ROOT/build.gradle"
          test -f "$PROJECT_ROOT/gradle.properties"
          test -f "$PROJECT_ROOT/app/build.gradle"
          test -f "$PROJECT_ROOT/app/proguard-rules.pro"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_ROOT/app/src/main/java/kz/moifiltry/app/MainActivity.java"
          test -f "$PROJECT_ROOT/app/src/main/assets/index.html"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_ROOT"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
