name: Сборка MoiFiltry 5.1 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Найти ZIP проекта
        shell: bash
        run: |
          set -e

          ZIP="MoiFiltry_5_1_INSTALL_READY_FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ОШИБКА: $ZIP не найден в корне репозитория."
            echo "Файлы в репозитории:"
            ls -la
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Найден: $ZIP"

      - name: Распаковать Android проект
        shell: bash
        run: |
          set -e

          rm -rf _android_project
          mkdir _android_project

          unzip -q "$PROJECT_ZIP" -d _android_project

          echo "Содержимое проекта:"
          find _android_project -maxdepth 3 -type f | sort

      - name: Проверить структуру проекта
        shell: bash
        run: |
          set -e

          cd _android_project

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          grep -q "applicationId 'kz.moifiltry.app51'" app/build.gradle
          grep -q "versionName '5.1'" app/build.gradle
          grep -q "function completeService" app/src/main/assets/index.html
          grep -q "Выполнено" app/src/main/assets/index.html
          grep -q "История обслуживания" app/src/main/assets/index.html
          grep -q "Изменить" app/src/main/assets/index.html

          echo "Структура и ключевые функции проверены."

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK компоненты
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools" \
                      "platforms;android-35" \
                      "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать Release APK
        shell: bash
        run: |
          set -e

          cd _android_project

          gradle --version

          gradle clean assembleRelease --no-daemon --stacktrace

          test -f app/build/outputs/apk/release/app-release-unsigned.apk

          ls -lh app/build/outputs/apk/release/

      - name: Подписать APK
        shell: bash
        run: |
          set -e

          cd _android_project

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          keytool \
            -genkeypair \
            -v \
            -keystore moifiltry-release.keystore \
            -alias moifiltry \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass moifiltry123 \
            -keypass moifiltry123 \
            -dname "CN=MoiFiltry, OU=MoiFiltry, O=MoiFiltry, L=Almaty, ST=Almaty, C=KZ"

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/MoiFiltry-5.1-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks moifiltry-release.keystore \
            --ks-key-alias moifiltry \
            --ks-pass pass:moifiltry123 \
            --key-pass pass:moifiltry123 \
            --out app/build/outputs/apk/release/MoiFiltry-5.1.apk \
            app/build/outputs/apk/release/MoiFiltry-5.1-aligned.apk

      - name: Проверить готовый APK
        shell: bash
        run: |
          set -e

          cd _android_project

          APK="app/build/outputs/apk/release/MoiFiltry-5.1.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -f "$APK"

          echo "Размер APK:"
          ls -lh "$APK"

          echo "Проверка подписи:"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          echo "Проверка package name:"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='kz.moifiltry.app51'"

          echo "Проверка версии:"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "versionName='5.1'"

          echo "Проверка APK пройдена."

      - name: Подготовить APK
        shell: bash
        run: |
          set -e

          cp \
            _android_project/app/build/outputs/apk/release/MoiFiltry-5.1.apk \
            "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

          ls -lh "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

      - name: Загрузить APK как artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: MoiFiltry-5.1.apk
          compression-level: 0
          if-no-files-found: error

      - name: Создать прямой APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="moifiltry-5.1-build-${{ github.run_number }}"

          gh release create "$TAG" \
            MoiFiltry-5.1.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MoiFiltry 5.1 — Build ${{ github.run_number }}" \
            --notes "Готовый подписанный APK MoiFiltry 5.1. Package: kz.moifiltry.app51"
