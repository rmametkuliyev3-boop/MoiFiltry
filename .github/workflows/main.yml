name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack project
        run: |
          set -e

          echo "Ищем ZIP-файл проекта..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден"
            exit 1
          fi

          echo "Найден: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Содержимое проекта:"
          find project -maxdepth 3 -type f | sort

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=$(find project -type f -name "settings.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: Android-проект не найден"
            exit 1
          fi

          echo "Android-проект найден:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Начинаем сборку..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Сборка завершена."

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "Найден APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/MoiFiltry-5.1.apk"

          SIZE=$(stat -c%s "$GITHUB_WORKSPACE/release/MoiFiltry-5.1.apk")

          echo "Размер APK: $SIZE байт"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ОШИБКА: APK подозрительно маленький"
            exit 1
          fi

          echo "Готово."

      - name: Upload ONLY APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: release/MoiFiltry-5.1.apk
          if-no-files-found: error
          retention-days: 7
