name: Build MoiFiltry 66

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 66
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'MoiFiltry_*.zip' | sort | tail -n 1)
            test -n "$ZIP_FILE"
            rm -rf /tmp/moifiltry-project
            mkdir -p /tmp/moifiltry-project
            unzip -q "$ZIP_FILE" -d /tmp/moifiltry-project
            PROJECT_DIR=$(find /tmp/moifiltry-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
            test -n "$PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project and phone setup
        run: |
          set -e
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          grep -Fq "applicationId 'kz.moifiltry.app.v66'" app/build.gradle
          grep -Fq "versionCode 18" app/build.gradle
          grep -Fq "versionName '6.6'" app/build.gradle

          grep -Fq 'function phoneDigits' app/src/main/assets/index.html
          grep -Fq 'maxlength="15"' app/src/main/assets/index.html
          grep -Fq '8 705 560 75 87' app/src/main/assets/index.html
          grep -Fq "length===11" app/src/main/assets/index.html
          grep -Fq 'Android.call' app/src/main/assets/index.html
          grep -Fq "Android.whatsapp" app/src/main/assets/index.html
          grep -Fq 'extraContactName' app/src/main/assets/index.html
          grep -Fq 'contactIcon callIcon' app/src/main/assets/index.html
          grep -Fq '.contactIcon{width:36px;height:36px;min-width:36px' app/src/main/assets/index.html
          grep -Fq '.plusMini{width:36px;height:36px' app/src/main/assets/index.html
          grep -Fq 'contactIcon waIcon' app/src/main/assets/index.html
          grep -Fq 'function callExtraContact' app/src/main/assets/index.html
          grep -Fq 'function waExtraContact' app/src/main/assets/index.html
          ! grep -Fq '>Позвонить</button>' app/src/main/assets/index.html
          ! grep -Fq '>WhatsApp</button>' app/src/main/assets/index.html
          ! grep -Fq '<span>+7</span>' app/src/main/assets/index.html

          grep -Fq 'returnToClientCard' app/src/main/assets/index.html
          grep -Fq 'returnToHistoryList' app/src/main/assets/index.html
          grep -Fq 'serviceHistoryList' app/src/main/assets/index.html
          grep -Fq 'function handleAndroidBack' app/src/main/assets/index.html
          grep -Fq 'let androidBackStack=[]' app/src/main/assets/index.html
          grep -Fq 'function restoreAndroidBackSnapshot' app/src/main/assets/index.html
          grep -Fq 'function mainHome' app/src/main/assets/index.html
          grep -Fq 'function financeHome' app/src/main/assets/index.html
          grep -Fq 'function financeOverview' app/src/main/assets/index.html
          grep -Fq 'function financeStatistics' app/src/main/assets/index.html
          grep -Fq 'function financeDefaultAccountId' app/src/main/assets/index.html
          grep -Fq 'financeHeaderDate' app/src/main/assets/index.html
          grep -Fq 'Общие данные' app/src/main/assets/index.html
          grep -Fq 'Статистика' app/src/main/assets/index.html
          grep -Fq 'Кошельки / счета' app/src/main/assets/index.html
          grep -Fq 'expenseSection' app/src/main/assets/index.html
          grep -Fq 'financeRow{display:flex' app/src/main/assets/index.html
          ! grep -Fq 'onclick="mainHome()">Назад' app/src/main/assets/index.html
          ! grep -Fq 'onclick="financeHome()">Назад' app/src/main/assets/index.html
          grep -Fq 'function financeAddIncomeSource' app/src/main/assets/index.html
          grep -Fq 'function financeAddAccount' app/src/main/assets/index.html
          grep -Fq 'function financeAddExpense' app/src/main/assets/index.html
          grep -Fq 'function financeOpenTransactionModal' app/src/main/assets/index.html
          grep -Fq 'function financeHistory' app/src/main/assets/index.html
          grep -Fq 'incomeCoin' app/src/main/assets/index.html
          grep -Fq 'accountCoin' app/src/main/assets/index.html
          grep -Fq 'expenseCoin' app/src/main/assets/index.html
          grep -Fq 'data-drop-type="account"' app/src/main/assets/index.html
          grep -Fq 'data-drop-type="expense"' app/src/main/assets/index.html

          echo 'Project and phone setup OK'

      - name: Build single APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MoiFiltry_66.apk
          rm app/build/outputs/apk/debug/app-debug.apk
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_66
          path: app/build/outputs/apk/debug/MoiFiltry_66.apk
          if-no-files-found: error
