name: Сборка MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Найти ТОЛЬКО нужный ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MoiFiltry_5_1_UI_CIRCLES_HISTORY_FINAL_CORRECTED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ОШИБКА: не найден $ZIP"
            echo "Файлы в корне:"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          echo "ZIP найден: $ZIP"

      - name: Распаковать ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _android_project
          mkdir -p _android_project
          unzip -q -o "MoiFiltry_5_1_UI_CIRCLES_HISTORY_FINAL_CORRECTED.zip" -d _android_project

          SETTINGS="$(find _android_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            find _android_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Проект: $PROJECT_ROOT"

      - name: Проверить исходник
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          grep -Fq "applicationId 'kz.moifiltry.app51'" app/build.gradle
          grep -Fq "versionName '5.1'" app/build.gradle
          grep -Fq "versionCode 10" app/build.gradle

          grep -Fq 'id="todayCount"' app/src/main/assets/index.html
          grep -Fq 'id="overdueCount"' app/src/main/assets/index.html
          grep -Fq 'onclick="showTaskList('\''today'\'')"' app/src/main/assets/index.html
          grep -Fq 'onclick="showTaskList('\''overdue'\'')"' app/src/main/assets/index.html
          grep -Fq 'class="statLabel">СЕГОДНЯ' app/src/main/assets/index.html
          grep -Fq 'class="statLabel">ПРОСРОЧЕНО' app/src/main/assets/index.html
          grep -Fq 'class="fab"' app/src/main/assets/index.html
          grep -Fq '>+</button>' app/src/main/assets/index.html
          grep -Fq 'function completeService' app/src/main/assets/index.html
          grep -Fq 'История обслуживания' app/src/main/assets/index.html

          echo "Проверка исходника: OK"

      - name: Проверить Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace help

      - name: Собрать Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Подписать APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/moifiltry.jks"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          FINAL="$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias moifiltry \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MoiFiltry, O=MoiFiltry, L=Almaty, C=KZ"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias moifiltry \
            --out "$FINAL" \
            "$ALIGNED"

          "$BT/apksigner" verify --verbose "$FINAL"
          test -s "$FINAL"

          echo "Готовый APK:"
          ls -lh "$FINAL"

      - name: Проверить именно APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"

          grep -Fq "package: name='kz.moifiltry.app51'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='5.1'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='10'" "$RUNNER_TEMP/badging.txt"

          echo "APK проверен: OK"
          grep "package:" "$RUNNER_TEMP/badging.txt"

      - name: Загрузить ТОЛЬКО APK
        uses: actions/upload-artifact@v5
        with:
          name: MoiFiltry-5.1-APK
          path: ./MoiFiltry-5.1.apk
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false

      - name: Создать Release с APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="moifiltry-5.1-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk" \
            --title "MoiFiltry 5.1 — Build ${GITHUB_RUN_NUMBER}" \
            --notes "Готовый подписанный APK MoiFiltry 5.1."
