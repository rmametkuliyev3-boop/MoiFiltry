name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and unpack project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP проекта не найден."
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "Проект распакован."

      - name: Find project root
        run: |
          set -e

          if [ -f project/settings.gradle ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle не найден."
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify project
        run: |
          set -e

          echo "Проверяем проект в: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Структура проекта OK"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)

          echo "Размер APK: $APK_SIZE bytes"
          echo "APK создан успешно."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
