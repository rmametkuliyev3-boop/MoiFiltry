name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -e
          echo "Проверяем структуру проекта..."
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          echo "Структура проекта OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make gradlew executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew не найден"
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build APK
        run: |
          set -e
          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          set -e
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
