name: Сборка MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Найти и распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP проекта не найден."
            exit 1
          fi

          echo "Найден: $ZIP_FILE"

          EXTRACT_DIR="$GITHUB_WORKSPACE/_android_project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: settings.gradle не найден после распаковки."
            find "$EXTRACT_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android-проект:"
          echo "$PROJECT_ROOT"

      - name: Проверка проекта
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -q "applicationId 'kz.moifiltry.app51'" app/build.gradle
          grep -q "versionName '5.1'" app/build.gradle

          grep -q "function completeService" app/src/main/assets/index.html
          grep -q "История обслуживания" app/src/main/assets/index.html
          grep -q "Выполнено" app/src/main/assets/index.html
          grep -q "Изменить" app/src/main/assets/index.html

          echo "Проверка проекта: OK"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Сборка APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверка APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не создан."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          if [ "$SIZE" -le 10000 ]; then
            echo "ОШИБКА: APK слишком маленький: $SIZE байт"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK создан и подписан."
          echo "Размер: $SIZE байт"

      - name: Подготовить APK
        shell: bash
        run: |
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

      - name: Скачать APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: MoiFiltry-5.1.apk
          if-no-files-found: error
          compression-level: 0
