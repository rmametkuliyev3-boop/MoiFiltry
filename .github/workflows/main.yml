name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка MoiFiltry APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Распаковать проект
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден"
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"

          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          echo "Содержимое проекта:"
          find project -maxdepth 3 -type f | sort

      - name: Найти Android проект
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: settings.gradle не найден внутри ZIP"
            exit 1
          fi

          echo "Корень Android проекта: $PROJECT_DIR"
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить Android проект
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"

          echo "Корень проекта:"
          pwd

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Android project OK"

      - name: Проверить функции приложения
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"

          grep -Fq 'addressExtra' app/src/main/assets/index.html
          grep -Fq 'История обслуживания' app/src/main/assets/index.html
          grep -Fq 'function completeTask' app/src/main/assets/index.html
          grep -Fq 'function replacementBaseDate' app/src/main/assets/index.html

          echo "Requested features OK"

      - name: Собрать APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Подготовить APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          cp "$APK" "MoiFiltry_01.apk"

          ls -lh MoiFiltry_01.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_01
          path: MoiFiltry_01.apk
          if-no-files-found: error
          retention-days: 7
