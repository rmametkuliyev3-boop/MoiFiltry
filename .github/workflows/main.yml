name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and extract current project ZIP
        run: |
          set -e

          ZIP_FILE="MoiFiltry_5_1_FIXED_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ОШИБКА: $ZIP_FILE не найден."
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Содержимое проекта:"
          find project -maxdepth 3 -type f | sort

          if [ ! -f project/settings.gradle ]; then
            echo "ОШИБКА: settings.gradle не найден после распаковки."
            exit 1
          fi

          if [ ! -f project/build.gradle ]; then
            echo "ОШИБКА: build.gradle не найден после распаковки."
            exit 1
          fi

          if [ ! -f project/app/build.gradle ]; then
            echo "ОШИБКА: app/build.gradle не найден после распаковки."
            exit 1
          fi

          echo "Android-проект найден."

      - name: Build APK
        working-directory: project
        run: |
          set -e

          echo "Gradle version:"
          gradle --version

          echo "Запускаем сборку MoiFiltry 5.1..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не создан."
            exit 1
          fi

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Create complete project ZIP
        run: |
          set -e

          cd project
          zip -qr ../MoiFiltry_5_1_BUILT_PROJECT.zip .
          cd ..

          ls -lh MoiFiltry_5_1_BUILT_PROJECT.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-FULL-PROJECT
          path: MoiFiltry_5_1_BUILT_PROJECT.zip
          if-no-files-found: error
