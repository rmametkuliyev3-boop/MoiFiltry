name: Build MyFilter 3 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MyFilter 3 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Find and unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            -print -quit)

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: No ZIP file was found in the repository."
            echo "Repository contents:"
            find . -maxdepth 3 -print | sort
            exit 1
          fi

          echo "Found ZIP:"
          echo "${ZIP_FILE}"

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "${ZIP_FILE}" -d extracted-project

          echo "ZIP successfully unpacked."

          echo "Extracted contents:"
          find extracted-project -maxdepth 4 -print | sort

      - name: Find Android project root
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find extracted-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            | head -n 1)

          if [ -z "${SETTINGS_FILE}" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "Extracted contents:"
            find extracted-project -maxdepth 6 -print | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "${SETTINGS_FILE}")
          PROJECT_ROOT=$(cd "${PROJECT_ROOT}" && pwd)

          echo "Android project root found:"
          echo "${PROJECT_ROOT}"

          echo "PROJECT_ROOT=${PROJECT_ROOT}" >> "${GITHUB_ENV}"

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_ROOT}"

          echo "Checking project root:"
          pwd

          if [ -f "settings.gradle" ]; then
            echo "OK: settings.gradle"
          elif [ -f "settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ERROR: settings.gradle/settings.gradle.kts missing."
            exit 1
          fi

          if [ -f "build.gradle" ]; then
            echo "OK: build.gradle"
          elif [ -f "build.gradle.kts" ]; then
            echo "OK: build.gradle.kts"
          else
            echo "ERROR: build.gradle/build.gradle.kts missing."
            exit 1
          fi

          test -f "gradle.properties"
          echo "OK: gradle.properties"

          test -d "app"
          echo "OK: app directory"

          MANIFEST=$(find app -type f \
            -path "*/src/main/AndroidManifest.xml" \
            -print \
            | head -n 1)

          if [ -z "${MANIFEST}" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "OK: ${MANIFEST}"

          MAIN_ACTIVITY=$(find app -type f \
            -name "MainActivity.java" \
            -print \
            | head -n 1)

          if [ -z "${MAIN_ACTIVITY}" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "OK: ${MAIN_ACTIVITY}"

          INDEX_HTML=$(find app -type f \
            -name "index.html" \
            -print \
            | head -n 1)

          if [ -z "${INDEX_HTML}" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "OK: ${INDEX_HTML}"

          echo "Android project structure verified successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_ROOT}"

          echo "Building Debug APK with Gradle 8.7..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find and verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE=$(find "${PROJECT_ROOT}/app/build/outputs/apk" \
            -type f \
            -name "app-debug.apk" \
            -print \
            | head -n 1)

          if [ -z "${APK_FILE}" ]; then
            echo "ERROR: app-debug.apk was not found."
            echo "APK output contents:"
            find "${PROJECT_ROOT}/app/build/outputs" -print || true
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${APK_FILE}")

          echo "APK found:"
          echo "${APK_FILE}"

          echo "APK size:"
          echo "${APK_SIZE} bytes"

          if [ "${APK_SIZE}" -le 0 ]; then
            echo "ERROR: APK size is zero."
            exit 1
          fi

          echo "APK_PATH=${APK_FILE}" >> "${GITHUB_ENV}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFilter 3 5.1 APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
