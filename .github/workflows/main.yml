name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Show repository structure
        run: |
          set -e
          echo "=== Содержимое репозитория ==="
          find . -maxdepth 5 -type f -not -path './.git/*' | sort
          echo "================================"

      - name: Find project ZIP
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find . -maxdepth 3 -type f \
              -iname "*.zip" \
              -not -path './.git/*' \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден."
            exit 1
          fi

          echo "Найден ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unpack project
        run: |
          set -e

          rm -rf project_unpacked
          mkdir -p project_unpacked

          unzip -q "$ZIP_FILE" -d project_unpacked

          echo "=== Файлы распакованного проекта ==="
          find project_unpacked -maxdepth 8 -type f | sort
          echo "===================================="

      - name: Find Android project root
        run: |
          set -e

          echo "Ищем settings.gradle..."

          SETTINGS_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              SETTINGS_FILE="$file"
              break
            fi
          done < <(
            find project_unpacked \
              -type f \
              -name "settings.gradle" \
              -not -path '*/.git/*' \
              | sort
          )

          if [ -z "$SETTINGS_FILE" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                SETTINGS_FILE="$file"
                break
              fi
            done < <(
              find project_unpacked \
                -type f \
                -name "settings.gradle.kts" \
                -not -path '*/.git/*' \
                | sort
            )
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: settings.gradle или settings.gradle.kts не найден."
            echo ""
            echo "Что находится внутри ZIP:"
            find project_unpacked -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "Найден settings:"
          echo "$SETTINGS_FILE"

          echo "Корень Android-проекта:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Check Gradle project
        run: |
          set -e

          echo "=== Проверка Android-проекта ==="

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/build.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "ОШИБКА: build.gradle не найден."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/build.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          fi

          echo "Структура Android-проекта найдена."

      - name: Prepare Gradle 8.7
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            echo "Найден gradlew."
            chmod +x "$PROJECT_ROOT/gradlew"

            echo "Используем Gradle Wrapper из проекта."
          else
            echo "gradlew отсутствует."
            echo "Используем Gradle 8.7."

            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle-8.7-bin.zip

            sudo mkdir -p /opt/gradle
            sudo unzip -q /tmp/gradle-8.7-bin.zip -d /opt/gradle

            echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

            echo "Gradle 8.7 установлен."

            gradle --version
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "=== Запуск сборки APK ==="

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find and verify APK
        run: |
          set -e

          echo "=== Ищем APK ==="

          APK_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK_FILE="$file"
              break
            fi
          done < <(
            find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ -z "$APK_FILE" ]; then
            echo "ОШИБКА: APK не найден."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_FILE")

          echo "APK найден:"
          echo "$APK_FILE"

          echo "Размер APK:"
          echo "$APK_SIZE байт"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ОШИБКА: APK имеет нулевой размер."
            exit 1
          fi

          echo "APK успешно создан."

          rm -rf output
          mkdir -p output

          cp "$APK_FILE" output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: output/app-debug.apk
          if-no-files-found: error
