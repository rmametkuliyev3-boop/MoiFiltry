name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Распаковываем ZIP проекта
        shell: bash
        run: |
          set -e

          echo "Ищем ZIP проекта..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP проекта не найден."
            exit 1
          fi

          echo "Найден:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          echo "Распаковываем..."

          unzip -q "$ZIP_FILE" -d android_project

          echo ""
          echo "Содержимое ZIP:"
          find android_project -maxdepth 5 -type f | sort

      - name: Находим Android-проект
        shell: bash
        run: |
          set -e

          echo "Ищем settings.gradle..."

          SETTINGS=$(find android_project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ОШИБКА: settings.gradle не найден внутри ZIP."

            echo ""
            echo "Полная структура:"
            find android_project -maxdepth 8 -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android-проект найден:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Проверяем структуру проекта
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Проверяем:"
          pwd

          echo ""
          echo "Файлы:"
          find . -maxdepth 4 -type f | sort

          echo ""

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ОШИБКА: корневой build.gradle не найден."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ОШИБКА: папка app не найдена."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          fi

          echo "Структура проекта корректная."

      - name: Устанавливаем Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Проверяем Gradle
        run: |
          set -e
          gradle --version

      - name: Собираем APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Начинаем сборку MoiFiltry..."

          gradle assembleDebug --stacktrace

      - name: Проверяем APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден."
            exit 1
          fi

          echo "APK найден:"
          echo "$APK"

          echo ""
          echo "Размер:"
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "Размер в байтах: $SIZE"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ОШИБКА: APK подозрительно маленький."
            exit 1
          fi

          echo "APK успешно собран."

      - name: Загружаем APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
