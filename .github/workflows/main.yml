name: Build MoiFiltry 70

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 70
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          set -e
          if ! find . -type f -name 'settings.gradle' -print -quit | grep -q .; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' -print -quit || true)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p .build_source
              unzip -q "$ZIP_FILE" -d .build_source
            fi
          fi

          SETTINGS=$(find . -type f -name 'settings.gradle' -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Prepare single APK
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$PROJECT_DIR/app/build/outputs/apk/debug/MoiFiltry_70.apk"
          rm "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_70
          path: '**/app/build/outputs/apk/debug/MoiFiltry_70.apk'
          if-no-files-found: error
