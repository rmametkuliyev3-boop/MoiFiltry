name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка MoiFiltry 78
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти ZIP 78
        shell: bash
        run: |
          set -e

          shopt -s nullglob
          zips=( *.zip )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Ошибка: в корне должен находиться ровно один ZIP-файл."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          ZIP="${zips[0]}"

          if [[ "$ZIP" != *78* ]]; then
            echo "Ошибка: ZIP должен содержать номер версии 78."
            echo "Найден: $ZIP"
            exit 1
          fi

          echo "Используется исходник: $ZIP"

          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Найти Android-проект
        shell: bash
        run: |
          set -e

          SETTINGS=$(find source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Ошибка: settings.gradle не найден."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android-проект найден:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Проверка SDK 35"

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Android SDK 35 не найден."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android Build Tools 35.0.0 не найдены."
            exit 1
          fi

      - name: Настроить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить версию 78
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Проверяем app/build.gradle"

          grep -Fq "applicationId 'kz.moifiltry.app.v78'" app/build.gradle
          grep -Fq "versionName '7.8'" app/build.gradle

          echo "Версия 78 подтверждена."

      - name: Проверить интерфейс финансов
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          FILE="app/src/main/assets/index.html"

          test -f "$FILE"

          grep -Fq "financeDrawer" "$FILE"
          grep -Fq "Общие данные" "$FILE"
          grep -Fq "Статистика" "$FILE"
          grep -Fq "История" "$FILE"

          grep -Fq "function financeAdd" "$FILE"

          if grep -Fq 'class="financeActionBar"' "$FILE"; then
            echo "Ошибка: старая нижняя панель Доход/Расход/Перевод осталась."
            exit 1
          fi

          echo "Финансовый интерфейс проверен."

      - name: Проверить JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          FILE="app/src/main/assets/index.html"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")

          scripts = re.findall(
              r"<script(?:\\s[^>]*)?>(.*?)</script>",
              html,
              flags=re.S | re.I
          )

          if not scripts:
              raise SystemExit("JavaScript в index.html не найден.")

          for i, script in enumerate(scripts):
              if not script.strip():
                  continue

              path = Path(tempfile.gettempdir()) / f"moifiltry_script_{i}.js"
              path.write_text(script, encoding="utf-8")

              result = subprocess.run(
                  ["node", "--check", str(path)],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(
                      f"Ошибка синтаксиса JavaScript в script #{i}"
                  )

          print("JavaScript syntax OK.")
          PY

      - name: Собрать APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK не найден."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK найден:"
          ls -lh "$APK"

      - name: Подготовить APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MoiFiltry_78.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_78
          path: MoiFiltry_78.apk
          if-no-files-found: error
