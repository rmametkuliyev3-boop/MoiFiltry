name: Build MoiFiltry 5.1 APK — календарь, счётчики и поиск

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and unpack project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP проекта не найден"
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          PROJECT_ROOT=$(find project -name settings.gradle -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle не найден после распаковки ZIP"
            exit 1
          fi

          echo "Корень проекта: $PROJECT_ROOT"

          rm -rf extracted
          mkdir extracted

          cp -a "$PROJECT_ROOT"/. extracted/

      - name: Verify project
        working-directory: extracted
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/proguard-rules.pro
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          echo "Структура проекта OK"

      - name: Verify core features
        working-directory: extracted
        run: |
          set -e

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "function callClient" app/src/main/assets/index.html
          grep -q "function openSearch" app/src/main/assets/index.html
          grep -q "function searchNow" app/src/main/assets/index.html
          grep -q "function todayRequests" app/src/main/assets/index.html
          grep -q "function overdueRequests" app/src/main/assets/index.html
          grep -q "function toggleClosed" app/src/main/assets/index.html
          grep -q "function renderCalendar" app/src/main/assets/index.html

          echo "Основные функции найдены"

      - name: Build APK
        working-directory: extracted
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        working-directory: extracted
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: APK пустой"
            exit 1
          fi

          echo "APK найден"
          echo "Размер APK: $SIZE bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
