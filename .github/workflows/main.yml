name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'MoiFiltry*.zip' | sort | tail -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "Не найден ZIP проекта MoiFiltry и нет settings.gradle/settings.gradle.kts"
              exit 1
            fi

            echo "Распаковываем: $ZIP_FILE"
            rm -rf /tmp/moifiltry-project
            mkdir -p /tmp/moifiltry-project
            unzip -q "$ZIP_FILE" -d /tmp/moifiltry-project

            if [ -f /tmp/moifiltry-project/settings.gradle ] || [ -f /tmp/moifiltry-project/settings.gradle.kts ]; then
              cp -a /tmp/moifiltry-project/. .
            else
              PROJECT_DIR=$(find /tmp/moifiltry-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

              if [ -z "$PROJECT_DIR" ]; then
                echo "В ZIP не найден settings.gradle/settings.gradle.kts"
                exit 1
              fi

              cp -a "$PROJECT_DIR"/. .
            fi
          fi

          echo "Проект подготовлен"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify project
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          grep -q 'width:48px;height:48px' app/src/main/assets/index.html
          ! grep -q '.taskCircle{width:56px;height:56px' app/src/main/assets/index.html

          echo "Структура проекта и размер кружочков 48x48 OK"

      - name: Verify delete and call
        run: |
          set -e

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "db.clients.splice" app/src/main/assets/index.html
          grep -q "function callClient" app/src/main/assets/index.html
          grep -q "public void call" app/src/main/java/kz/moifiltry/app/MainActivity.java
          grep -q "ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок OK"

      - name: Build APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
