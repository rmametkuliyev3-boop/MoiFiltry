name: Сборка MoiFiltry APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
      - "main.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry 86
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.added), '.zip') ||
      contains(toJSON(github.event.commits.*.modified), '.zip') ||
      contains(toJSON(github.event.commits.*.added), '.github/workflows/main.yml') ||
      contains(toJSON(github.event.commits.*.modified), '.github/workflows/main.yml') ||
      contains(toJSON(github.event.commits.*.added), 'main.yml') ||
      contains(toJSON(github.event.commits.*.modified), 'main.yml')
    runs-on: ubuntu-latest

    steps:
      - name: Получить текущий коммит репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Проверить ZIP 86 и версию проекта
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/main.yml

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен находиться ровно один ZIP-источник."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_NAME="${ZIPS[0]}"

          [[ "$ZIP_NAME" =~ ^MoiFiltry_86([_-].*)?\.zip$ ]] || {
            echo "ОШИБКА: найден не ZIP 86: $ZIP_NAME"
            exit 1
          }

          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"

          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/moifiltry-project"

          SETTINGS_FILE="$(
            find "$RUNNER_TEMP/moifiltry-project" \
              -type f \
              -name settings.gradle \
              -print -quit
          )"

          test -n "$SETTINGS_FILE" || {
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/build.gradle" || {
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          }

          APP_ID="$(
            grep -E "^[[:space:]]*applicationId[[:space:]]+['\"]" \
              "$PROJECT_DIR/app/build.gradle" |
            head -n 1 |
            awk '{print $2}' |
            tr -d "'\""
          )"

          VERSION_NAME="$(
            grep -E "^[[:space:]]*versionName[[:space:]]+['\"]" \
              "$PROJECT_DIR/app/build.gradle" |
            head -n 1 |
            awk '{print $2}' |
            tr -d "'\""
          )"

          echo "Найден applicationId: $APP_ID"
          echo "Найден versionName: $VERSION_NAME"

          test "$APP_ID" = "kz.moifiltry.app.v86" || {
            echo "ОШИБКА: applicationId=$APP_ID"
            exit 1
          }

          test "$VERSION_NAME" = "8.6" || {
            echo "ОШИБКА: versionName=$VERSION_NAME"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Источник подтверждён: $ZIP_NAME"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить проект 86
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -Fq "applicationId 'kz.moifiltry.app.v86'" app/build.gradle
          grep -Fq "versionName '8.6'" app/build.gradle
          grep -Fq 'versionCode 30' app/build.gradle
          grep -Fq 'android:label="Мои Фильтры 86"' \
            app/src/main/AndroidManifest.xml

          grep -Fq 'function financeFindDropTarget' \
            app/src/main/assets/index.html
          grep -Fq 'function financeTouchStart' \
            app/src/main/assets/index.html
          grep -Fq 'Android.openMapChooser(clean)' \
            app/src/main/assets/index.html

          ! grep -Fq "prompt('Открыть адрес" \
            app/src/main/assets/index.html

          grep -Fq 'function serviceHistoryList' \
            app/src/main/assets/index.html
          grep -Fq 'historyInstall' \
            app/src/main/assets/index.html
          grep -Fq 'Дата установки' \
            app/src/main/assets/index.html
          grep -Fq 'Следующая замена' \
            app/src/main/assets/index.html
          grep -Fq 'Обслуживаний пока не было.' \
            app/src/main/assets/index.html

          grep -Fq 'Дата установки не является заменой' \
            app/src/main/assets/index.html

          grep -Fq \
            'history=history.filter(h=>String(h.date)!==installDate)' \
            app/src/main/assets/index.html

          grep -Fq 'function completeTask' \
            app/src/main/assets/index.html

          grep -Fq 'function financeFinishDrag' \
            app/src/main/assets/index.html

          node --check script.js

          sed -n '/<script>/,/<\/script>/p' \
            app/src/main/assets/index.html |
            sed '1d;$d' > "$RUNNER_TEMP/moifiltry-check.js"

          node --check "$RUNNER_TEMP/moifiltry-check.js"

          cmp -s "$RUNNER_TEMP/moifiltry-check.js" script.js || {
            echo "ОШИБКА: script.js и встроенный JS расходятся."
            exit 1
          }

      - name: Собрать APK 86
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name '*.apk' |
            sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ОШИБКА: должен быть ровно один APK."
            echo "Найдено: ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          cp "${APKS[0]}" \
            "$GITHUB_WORKSPACE/MoiFiltry_86.apk"

      - name: Загрузить APK 86
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_86
          path: MoiFiltry_86.apk
          if-no-files-found: error
