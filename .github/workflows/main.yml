name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_DIR: project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and unpack project ZIP
        run: |
          set -e
          echo "Ищем ZIP проекта..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP-файл проекта не найден."
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          echo "Проект распакован."

      - name: Verify project structure
        working-directory: project
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          echo "Структура проекта OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: project
        run: |
          set -e

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        working-directory: project
        run: |
          set -e

          echo "Проверяем созданный APK..."

          test -f app/build/outputs/apk/debug/app-debug.apk

          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)

          echo "Размер APK: $APK_SIZE bytes"

          test "$APK_SIZE" -gt 0

          echo "APK создан успешно."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
