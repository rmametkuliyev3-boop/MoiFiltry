name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MoiFiltry_5_1_DELETE_CALL_FIXED_FINAL.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify source ZIP
        run: |
          test -f "MoiFiltry_5_1_DELETE_CALL_FIXED_FINAL.zip"
          rm -rf _android_project
          mkdir -p _android_project
          unzip -q "MoiFiltry_5_1_DELETE_CALL_FIXED_FINAL.zip" -d _android_project

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          ROOT="$(find "$GITHUB_WORKSPACE/_android_project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          test -n "$ROOT"
          PROJECT_DIR="$(dirname "$ROOT")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Verify project structure and requested fixes
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -q "applicationId 'kz.moifiltry.app51'" app/build.gradle
          grep -q "versionName '5.1'" app/build.gradle
          grep -q "compileSdk 35" app/build.gradle
          grep -q "JavaVersion.VERSION_17" app/build.gradle

          grep -q "function deleteClient(i)" app/src/main/assets/index.html
          grep -q "db.clients.splice(i,1)" app/src/main/assets/index.html
          grep -q "function callClient(i)" app/src/main/assets/index.html
          grep -q "Android.call" app/src/main/assets/index.html
          grep -q "public void call(String phone)" app/src/main/java/kz/moifiltry/app/MainActivity.java
          grep -q "Intent.ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-DELETE-CALL-FIXED-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
