name: Сборка MoiFiltry APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry
    runs-on: ubuntu-latest

    steps:
      - name: Получить текущий репозиторий
        uses: actions/checkout@v4

      - name: Найти единственный ZIP-источник
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен быть ровно один ZIP-источник."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_NAME="${ZIPS[0]}"

          echo "Источник: $ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"

          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/moifiltry-project"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/moifiltry-project" -type f -name settings.gradle -print -quit)"

          test -n "$SETTINGS_FILE" || {
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Определить и проверить версию источника
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f app/build.gradle

          APP_ID="$(sed -n "s/.*applicationId ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          VERSION_NAME="$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"

          test -n "$APP_ID" || {
            echo "ОШИБКА: applicationId не найден."
            exit 1
          }

          test -n "$VERSION_NAME" || {
            echo "ОШИБКА: versionName не найден."
            exit 1
          }

          VERSION_CODE="${APP_ID##*.v}"
          VERSION_NUMBER="${VERSION_NAME//./}"

          if [[ "$APP_ID" != kz.moifiltry.app.v* ]]; then
            echo "ОШИБКА: неожиданный applicationId: $APP_ID"
            exit 1
          fi

          if [[ "$VERSION_CODE" != "$VERSION_NUMBER" ]]; then
            echo "ОШИБКА: applicationId ($APP_ID) и versionName ($VERSION_NAME) не совпадают."
            exit 1
          fi

          if [[ "$ZIP_NAME" != *"$VERSION_CODE"* ]]; then
            echo "ОШИБКА: имя ZIP ($ZIP_NAME) не содержит номер версии $VERSION_CODE."
            exit 1
          fi

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Версия источника: $VERSION_NAME"
          echo "ApplicationId: $APP_ID"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Глубокая проверка проекта
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -Fq 'function financeMenuToggle' app/src/main/assets/index.html
          grep -Fq 'class="financeDrawer"' app/src/main/assets/index.html
          grep -Fq 'function financeOverview' app/src/main/assets/index.html
          grep -Fq 'function financeStatistics' app/src/main/assets/index.html
          grep -Fq 'function financeHistory' app/src/main/assets/index.html
          grep -Fq 'function financeBindDrag' app/src/main/assets/index.html
          grep -Fq 'function financeOpenCalculator' app/src/main/assets/index.html
          grep -Fq 'financeOverviewRing' app/src/main/assets/index.html
          grep -Fq 'function backup' app/src/main/assets/index.html
          grep -Fq 'Android.restore()' app/src/main/assets/index.html
          grep -Fq 'pointercancel' app/src/main/assets/index.html
          grep -Fq 'elementsFromPoint' app/src/main/assets/index.html
          grep -Fq 'financeDragGhost' app/src/main/assets/index.html

          ! grep -Fq 'financeActionBar' app/src/main/assets/index.html
          ! grep -Fq 'financeHint' app/src/main/assets/index.html
          ! grep -Fq 'financeDatePrompt' app/src/main/assets/index.html
          ! grep -Fq 'financeHeaderDate' app/src/main/assets/index.html
          ! grep -Fq 'financeFilterDate' app/src/main/assets/index.html

          grep -Fq 'addressExtra' app/src/main/assets/index.html
          grep -Fq 'serviceHistory' app/src/main/assets/index.html
          grep -Fq "const cartridges=['PP5','GAC','CTO','PP1','Пост-фильтр','Минерализатор','RO-мембрана']" app/src/main/assets/index.html
          grep -Fq "const brands=['Вастерлайн','Ecosoft','FitAqua']" app/src/main/assets/index.html

          sed -n '/<script>/,/<\/script>/p' app/src/main/assets/index.html | sed '1d;$d' > "$RUNNER_TEMP/moifiltry-check.js"

          node --check "$RUNNER_TEMP/moifiltry-check.js"
          node --check script.js

          echo "Глубокая проверка пройдена для $VERSION_NAME."

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Подготовить APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)"

          test -n "$APK" || {
            echo "ОШИБКА: APK не найден."
            exit 1
          }

          cp "$APK" "$GITHUB_WORKSPACE/MoiFiltry_${VERSION_CODE}.apk"

          echo "APK_FILE=MoiFiltry_${VERSION_CODE}.apk" >> "$GITHUB_ENV"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_${{ env.VERSION_CODE }}
          path: MoiFiltry_${{ env.VERSION_CODE }}.apk
          if-no-files-found: error
