name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        run: |
          set -e
          echo "Проверяем структуру проекта..."
          find . -maxdepth 4 -type f | sort
          echo "Структура проекта проверена."

      - name: Build APK
        run: |
          set -e
          echo "Запускаем сборку..."
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          set -e
          find . -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK успешно создан."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
