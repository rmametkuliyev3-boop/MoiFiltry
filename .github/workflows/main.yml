name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Показать структуру проекта
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "СТРУКТУРА ПРОЕКТА"
          echo "========================================"

          pwd
          find . -maxdepth 5 -type f | sort

      - name: Проверить Gradle
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            echo "ОШИБКА: gradlew не найден."
            echo "Содержимое корня проекта:"
            ls -la
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle Wrapper найден."
          ./gradlew --version

      - name: Собрать APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "НАЧИНАЕМ СБОРКУ APK"
          echo "========================================"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить APK
        shell: bash
        run: |
          set -e

          echo "Ищем APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: app-debug.apk не найден."
            exit 1
          fi

          echo "========================================"
          echo "APK УСПЕШНО СОЗДАН"
          echo "========================================"

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
