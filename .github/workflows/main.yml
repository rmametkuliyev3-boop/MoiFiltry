name: Build MoiFiltry APK 13

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project and phone setup
        run: |
          set -e

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          grep -q "applicationId 'kz.moifiltry.app.v63'" app/build.gradle
          grep -q "versionCode 11" app/build.gradle
          grep -q "versionName '6.3'" app/build.gradle

          grep -q 'function phoneDigits' app/src/main/assets/index.html
          grep -q "phoneDigits(get('phone').value).length===11" app/src/main/assets/index.html
          grep -q "Android.call(p)" app/src/main/assets/index.html
          grep -q "Android.whatsapp('7'+p.slice(1))" app/src/main/assets/index.html

          ! grep -q '<span>+7</span>' app/src/main/assets/index.html

          echo "Project and phone setup OK"

      - name: Build single APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          APK_COUNT=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' | wc -l)

          test "$APK_COUNT" -eq 1

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "Single APK OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-13-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
