<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мои Фильтры 5.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f6;font-family:Arial,sans-serif;color:#222;padding-bottom:90px}header{background:#1976d2;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}h1{margin:0 0 9px;font-size:20px}.search{width:100%;padding:11px;border:0;border-radius:10px;font-size:16px}main{max-width:700px;margin:auto;padding:10px}.top{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 12px;font-size:14px;background:#1976d2;color:#fff}.gray{background:#687078}.red{background:#d33}.green{background:#43a047}.small{font-size:12px}.card{background:#fff;border-radius:13px;padding:13px;margin:9px 0;box-shadow:0 2px 7px #0001}.name{font-size:18px;font-weight:bold}.muted{color:#666;font-size:13px;margin-top:5px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:12px;background:#e9eef3}.badge.red{background:#f6d5d5;color:#a00}.badge.green{background:#d9f0dc;color:#176b22}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}label{display:block;margin:9px 0 5px;color:#555;font-size:14px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:#fff}textarea{min-height:70px}.checks label{margin:6px 0;color:#222}.checks input{width:auto}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.grid button{min-height:48px;padding:4px 1px}.dow{text-align:center;font-size:11px;font-weight:bold}.history-item{border-left:4px solid #43a047;padding:9px 11px;margin:7px 0;background:#f7f9fa;border-radius:7px}.bottom{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;box-shadow:0 -2px 8px #0002;z-index:10}.bubble{position:absolute;bottom:13px;width:46px;height:46px;border-radius:50%;border:0;color:#fff;font-size:18px;font-weight:bold}.bubble.today{left:calc(50% - 75px);background:#1976d2}.bubble.overdue{left:calc(50% - 25px);background:#d33}.plus{right:16px;width:46px;height:46px;bottom:13px;border-radius:50%;border:0;background:#1976d2;color:#fff;font-size:27px}.section-title{font-weight:bold;font-size:17px;margin:4px 0 8px}.stock-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:9px 0}.stock-row button{width:34px;height:34px;border:0;border-radius:50%;font-size:20px;background:#e9eef3}.stock-count{min-width:35px;text-align:center;font-weight:bold}.notice{padding:9px;border-radius:9px;background:#fff3cd;margin:8px 0;font-size:13px}
</style></head><body>
<header><h1>Мои Фильтры</h1><input id="search" class="search" placeholder="Поиск клиента, телефона, адреса..." oninput="render()"></header>
<main><div class="top"><button class="btn" onclick="openForm()">Клиенты</button><button class="btn gray" onclick="openCalendar()">Календарь</button><button class="btn gray" onclick="openStock()">Склад</button><button class="btn gray" onclick="backup()">Резервная копия</button><button class="btn gray" onclick="restore()">Восстановить</button></div><div id="list"></div></main>
<div class="bottom"><button id="todayBubble" class="bubble today" onclick="openToday()">0</button><button id="overdueBubble" class="bubble overdue" onclick="openOverdue()">0</button><button class="plus" onclick="openForm()">+</button></div>
<div id="formModal" class="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><h2 id="formTitle">Новый клиент</h2><input id="editId" type="hidden"><label>Имя клиента</label><input id="name"><label>Телефон</label><input id="phone" type="tel"><div id="extraPhones"></div><button class="btn gray" type="button" onclick="addPhoneField()">+ Дополнительный контакт</button><label>Адрес</label><input id="address"><label>Модель фильтра</label><select id="model"><option value="">Выберите модель</option><option>Ecosoft с насосом</option><option>Ecosoft без насоса</option><option>FitAqua с насосом</option><option>FitAqua без насоса</option><option>Другое</option></select><label>Дата установки</label><input id="date" type="date"><label>Следующая замена</label><input id="service" type="date"><label>Картриджи</label><div class="card checks"><label><input type="checkbox" class="cons" value="PP1"> PP1</label><label><input type="checkbox" class="cons" value="CTO"> CTO</label><label><input type="checkbox" class="cons" value="GAK"> GAK</label><label><input type="checkbox" class="cons" value="PP5"> PP5</label><label><input type="checkbox" class="cons" value="Минерализатор"> Минерализатор</label><label><input type="checkbox" class="cons" value="RO-мембрана"> RO-мембрана</label><label><input type="checkbox" class="cons" value="Другое"> Другое</label></div><label>История обслуживания</label><div id="historyList" class="card"></div><button class="btn gray" type="button" onclick="addHistory()">+ Добавить событие</button><label>Примечание</label><textarea id="note"></textarea><div class="actions"><button class="btn" onclick="saveClient()">Сохранить</button><button class="btn gray" onclick="closeForm()">Отмена</button></div></div></div>
<div id="historyModal" class="modal" onclick="if(event.target===this)closeHistory()"><div class="sheet"><h2 id="historyTitle">Добавить событие</h2><label>Что сделали</label><input id="histType" value="Замена картриджей"><label>Дата</label><input id="histDate" type="date"><label>Расходные материалы</label><div class="card checks" id="histChecks"><label><input type="checkbox" class="histCons" value="PP1"> PP1</label><label><input type="checkbox" class="histCons" value="CTO"> CTO</label><label><input type="checkbox" class="histCons" value="GAK"> GAK</label><label><input type="checkbox" class="histCons" value="PP5"> PP5</label><label><input type="checkbox" class="histCons" value="Минерализатор"> Минерализатор</label><label><input type="checkbox" class="histCons" value="RO-мембрана"> RO-мембрана</label><label><input type="checkbox" class="histCons" value="Другое"> Другое</label></div><label>Примечание</label><textarea id="histNote"></textarea><div class="actions"><button class="btn" onclick="saveHistory()">Сохранить</button><button class="btn gray" onclick="closeHistory()">Отмена</button></div></div></div>
<div id="calModal" class="modal" onclick="if(event.target===this)closeCalendar()"><div class="sheet"><h2>Календарь замен</h2><div class="top"><button class="btn gray" onclick="month(-1)">‹</button><button class="btn gray" onclick="month(1)">›</button></div><h3 id="calTitle" style="text-align:center"></h3><div id="calendar"></div><div id="events"></div><button class="btn gray" style="width:100%;margin-top:10px" onclick="closeCalendar()">Закрыть</button></div></div>
<div id="stockModal" class="modal" onclick="if(event.target===this)closeStock()"><div class="sheet"><h2>Склад</h2><div class="section-title">Фильтры</div><div id="modelStock"></div><div class="section-title" style="margin-top:14px">Картриджи</div><div id="cartridgeStock"></div><button class="btn gray" style="width:100%;margin-top:10px" onclick="closeStock()">Закрыть</button></div></div>
<div id="infoModal" class="modal" onclick="if(event.target===this)closeInfo()"><div class="sheet"><h2 id="infoTitle"></h2><div id="infoBody"></div><button class="btn gray" style="width:100%;margin-top:10px" onclick="closeInfo()">Закрыть</button></div></div>
<script>
const KEY='moifiltry5';
const MODELS=['Ecosoft с насосом','Ecosoft без насоса','FitAqua с насосом','FitAqua без насоса','Другое'];
const CARTS=['PP1','CTO','GAK','PP5','Минерализатор','RO-мембрана','Другое'];
let db=loadDB(),cal=new Date(),editingHistoryId='';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.clients)){x.stock=x.stock||{models:{},cartridges:{}};x.stock.models=x.stock.models||{};x.stock.cartridges=x.stock.cartridges||{};x.nextClientNumber=x.nextClientNumber||1;x.clients=x.clients.map(normalize);return x}}catch(e){}return {clients:[],nextClientNumber:1,stock:{models:{},cartridges:{}}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diffDays(a,b=today()){return Math.ceil((new Date(a)-new Date(b))/86400000)}
function normalize(c){c.history=Array.isArray(c.history)?c.history:[];c.extraPhones=Array.isArray(c.extraPhones)?c.extraPhones:[];c.consumables=Array.isArray(c.consumables)?c.consumables:[];if(!c.inventory&&c.model)c.inventory={model:c.model,cartridges:[...c.consumables],migrated:true,stockApplied:false};else if(c.inventory&&c.inventory.stockApplied===undefined)c.inventory.stockApplied=c.inventory.migrated===true?false:true;c.history=c.history.map(h=>{if(!h||typeof h!=='object')return h;return h});return c}
function parseMaterials(v){let text=String(v||'');return CARTS.filter(x=>text.split(/\s*\+\s*|,\s*/).map(y=>y.trim()).includes(x))}
function inventoryOf(c){return c.inventory&&c.inventory.model!==undefined?{model:c.inventory.model,cartridges:[...(c.inventory.cartridges||[])]}:{model:c.model||'',cartridges:[...(c.consumables||[])]}}
function stockObj(){db.stock=db.stock||{models:{},cartridges:{}};db.stock.models=db.stock.models||{};db.stock.cartridges=db.stock.cartridges||{};return db.stock}
function qty(type,name){let s=stockObj();return Math.max(0,Number((type==='model'?s.models:s.cartridges)[name]||0))}
function changeStock(type,name,delta){let s=stockObj(),o=type==='model'?s.models:s.cartridges;o[name]=Math.max(0,qty(type,name)+delta);persist();renderStock()}
function available(inv){return qty('model',inv.model)>=1&&inv.cartridges.every(x=>qty('cartridge',x)>=1)}
function deduct(inv){let s=stockObj();s.models[inv.model]=Math.max(0,qty('model',inv.model)-1);inv.cartridges.forEach(x=>s.cartridges[x]=Math.max(0,qty('cartridge',x)-1))}
function addBack(inv){if(!inv)return;let s=stockObj();if(inv.model)s.models[inv.model]=qty('model',inv.model)+1;(inv.cartridges||[]).forEach(x=>s.cartridges[x]=qty('cartridge',x)+1)}
function cartridgesAvailable(mats,returned=[]){let need={};mats.forEach(x=>need[x]=(need[x]||0)+1);returned.forEach(x=>need[x]=(need[x]||0)-1);return Object.entries(need).every(([x,n])=>n<=0||qty('cartridge',x)>=n)}
function deductCartridges(mats){let s=stockObj();mats.forEach(x=>s.cartridges[x]=Math.max(0,qty('cartridge',x)-1))}
function stockKnown(c){return c.inventory&&c.inventory.model!==undefined}
function inventoryWasApplied(c){return stockKnown(c)&&c.inventory.stockApplied!==false}
function openForm(id=''){editId.value=id;formTitle.textContent=id?'Редактировать клиента':'Новый клиент';let c=id?db.clients.find(x=>x.id===id):null;c=c?normalize(c):{name:'',phone:'',address:'',model:'',date:today(),service:'',consumables:[],extraPhones:[],history:[],note:''};name.value=c.name||'';phone.value=c.phone||'';address.value=c.address||'';model.value=c.model||'';date.value=c.date||'';service.value=c.service||'';note.value=c.note||'';extraPhones.innerHTML=(c.extraPhones||[]).map(p=>`<input class="extraPhone" type="tel" value="${esc(p)}" placeholder="Дополнительный телефон">`).join('');document.querySelectorAll('.cons').forEach(x=>x.checked=(c.consumables||[]).includes(x.value));renderHistory(c);formModal.style.display='flex'}
function closeForm(){formModal.style.display='none'}
function addPhoneField(v=''){let box=document.getElementById('extraPhones'),row=document.createElement('div');row.className='top';row.style.marginTop='6px';let i=document.createElement('input');i.className='extraPhone';i.type='tel';i.placeholder='Дополнительный телефон';i.value=v;row.appendChild(i);box.appendChild(row)}
function saveClient(){let id=editId.value||Date.now().toString(),old=db.clients.find(x=>x.id===id),c=normalize({...old,id});['name','phone','address','model','date','service','note'].forEach(k=>c[k]=document.getElementById(k).value.trim());c.extraPhones=[...document.querySelectorAll('.extraPhone')].map(x=>x.value.trim()).filter(Boolean);c.consumables=[...document.querySelectorAll('.cons:checked')].map(x=>x.value);if(!c.name){alert('Введите имя клиента');return}let newInv={model:c.model,cartridges:[...c.consumables]};if(!old){if(!c.model){alert('Выберите модель фильтра');return}if(!available(newInv)){alert('На складе недостаточно выбранного комплекта. Сначала добавьте товар на склад.');return}deduct(newInv);c.inventory={model:newInv.model,cartridges:[...newInv.cartridges],stockApplied:true};c.clientNumber=db.nextClientNumber++;if(c.date&&!c.history.some(h=>h.type==='Установка'&&h.date===c.date))c.history.unshift({id:Date.now().toString(),type:'Установка',date:c.date,materials:c.consumables.join(', '),note:'Установлен фильтр',stockApplied:false})}else{let oldInv=inventoryOf(old),oldApplied=inventoryWasApplied(old),changed=oldInv.model!==newInv.model||JSON.stringify(oldInv.cartridges)!==JSON.stringify(newInv.cartridges);if(changed){if(!c.model){alert('Выберите модель фильтра');return}if(oldApplied)addBack(oldInv);if(!available(newInv)){if(oldApplied)deduct(oldInv);alert('Нельзя сохранить: нового комплекта не хватает на складе.');return}deduct(newInv);c.inventory={model:newInv.model,cartridges:[...newInv.cartridges],stockApplied:true}}else c.inventory={model:oldInv.model,cartridges:[...oldInv.cartridges],stockApplied:oldApplied};if(c.date&&!c.history.some(h=>h.type==='Установка'&&h.date===c.date))c.history.unshift({id:Date.now().toString(),type:'Установка',date:c.date,materials:c.consumables.join(', '),note:'Установлен фильтр',stockApplied:false})}let i=db.clients.findIndex(x=>x.id===id);if(i>=0)db.clients[i]=c;else db.clients.unshift(c);persist();closeForm();render()}
function del(id){let c=db.clients.find(x=>x.id===id);if(!c)return;if(confirm('Удалить клиента?')){if(inventoryWasApplied(c))addBack(inventoryOf(c));db.clients=db.clients.filter(x=>x.id!==id);persist();render()}}
function call(t){if(t)location.href='tel:'+t}function wa(t){if(t){let p=t.replace(/\D/g,'');if(p[0]==='8')p='7'+p.slice(1);location.href='https://wa.me/'+p}}
function status(c){if(!c.service)return '';let d=diffDays(c.service);if(d<0)return `<span class="badge red">Просрочено ${Math.abs(d)} дн.</span>`;if(d===0)return '<span class="badge red">Сегодня</span>';return `<span class="badge green">Через ${d} дн.</span>`}
function render(){let q=(search.value||'').toLowerCase().trim(),arr=db.clients.map(normalize).filter(c=>Object.values(c).join(' ').toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(c=>`<div class="card"><div class="name">${esc(c.name)} ${status(c)}</div>${c.clientNumber?`<div class="muted">Клиент № ${c.clientNumber}</div>`:''}${c.phone?`<div class="muted">📞 ${esc(c.phone)}</div>`:''}${c.address?`<div class="muted">📍 ${esc(c.address)}</div>`:''}${c.model?`<div class="muted">Фильтр: ${esc(c.model)}</div>`:''}${c.consumables.length?`<div class="muted">Картриджи: ${esc(c.consumables.join(' + '))}</div>`:''}${c.date?`<div class="muted">Установлен: ${esc(c.date)}</div>`:''}${c.service?`<div class="muted">Замена: ${esc(c.service)}</div>`:''}<div class="actions">${c.phone?`<button class="btn" onclick="call('${esc(c.phone)}')">Позвонить</button><button class="btn" onclick="wa('${esc(c.phone)}')">WhatsApp</button>`:''}<button class="btn" onclick="openForm('${c.id}')">Изменить</button><button class="btn red" onclick="del('${c.id}')">Удалить</button></div></div>`).join(''):'<div class="empty card">Клиентов пока нет.</div>';updateBubbles()}
function updateBubbles(){let t=today(),todayN=db.clients.filter(c=>c.service===t).length,over=db.clients.filter(c=>c.service&&c.service<t).length;todayBubble.textContent=todayN;overdueBubble.textContent=over}
function openToday(){showInfo('Заявки на сегодня',db.clients.filter(c=>c.service===today()))}
function openOverdue(){showInfo('Просроченные заявки',db.clients.filter(c=>c.service&&c.service<today()).sort((a,b)=>a.service.localeCompare(b.service)))}
function showInfo(title,arr){infoTitle.textContent=title;infoBody.innerHTML=arr.length?arr.map(c=>`<div class="card"><b>${esc(c.name)}</b>${c.phone?`<div class="muted">📞 ${esc(c.phone)}</div>`:''}${c.address?`<div class="muted">📍 ${esc(c.address)}</div>`:''}<div class="muted">Замена: ${esc(c.service||'')}</div><div class="actions"><button class="btn" onclick="closeInfo();openForm('${c.id}')">Открыть</button>${c.phone?`<button class="btn" onclick="call('${esc(c.phone)}')">Позвонить</button>`:''}</div></div>`).join(''):'<div class="empty">Заявок нет.</div>';infoModal.style.display='flex'}function closeInfo(){infoModal.style.display='none'}
function renderHistory(c){let box=document.getElementById('historyList'),h=(c.history||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));box.innerHTML=h.length?h.map(x=>`<div class="history-item"><b>${esc(x.type)}</b><div class="muted">${esc(x.date||'')}</div>${x.materials?`<div class="muted">Материалы: ${esc(x.materials)}</div>`:''}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}<div class="actions"><button class="btn gray" onclick="editHistory('${c.id}','${x.id}')">Редактировать</button><button class="btn red" onclick="removeHistory('${c.id}','${x.id}')">Удалить</button></div></div>`).join(''):'<div class="muted">История пока пустая.</div>'}
function historyMaterials(){return [...document.querySelectorAll('.histCons:checked')].map(x=>x.value)}
function setHistoryMaterials(arr){let a=Array.isArray(arr)?arr:[];document.querySelectorAll('.histCons').forEach(x=>x.checked=a.includes(x.value))}
function historyInventory(h){return h&&h.stockApplied===true&&h.inventory&&Array.isArray(h.inventory.cartridges)?{model:'',cartridges:[...h.inventory.cartridges]}:null}
function addHistory(){if(!editId.value){alert('Сначала сохраните клиента.');return}editingHistoryId='';historyTitle.textContent='Добавить событие';histType.value='Замена картриджей';histDate.value=today();setHistoryMaterials([]);histNote.value='';historyModal.style.display='flex'}
function editHistory(cid,hid){let c=db.clients.find(x=>x.id===cid),h=(c?.history||[]).find(x=>x.id===hid);if(!h)return;editingHistoryId=hid;editId.value=cid;historyTitle.textContent='Редактировать событие';histType.value=h.type||'';histDate.value=h.date||'';setHistoryMaterials(h.inventory?.cartridges||[]);histNote.value=h.note||'';historyModal.style.display='flex'}
function closeHistory(){historyModal.style.display='none';editingHistoryId=''}
function saveHistory(){let c=db.clients.find(x=>x.id===editId.value);if(!c)return;c.history=Array.isArray(c.history)?c.history:[];let mats=historyMaterials(),d={type:histType.value.trim()||'Событие',date:histDate.value,materials:mats.join(', '),note:histNote.value.trim()};if(editingHistoryId){let h=c.history.find(x=>x.id===editingHistoryId);if(!h)return;let oldMats=h.stockApplied===true&&Array.isArray(h.inventory?.cartridges)?[...h.inventory.cartridges]:[];if(JSON.stringify(oldMats)!==JSON.stringify(mats)){if(!cartridgesAvailable(mats,oldMats)){alert('Нельзя сохранить: выбранных новых картриджей не хватает на складе.');return}deductCartridges(mats);oldMats.forEach(x=>{let s=stockObj();s.cartridges[x]=qty('cartridge',x)+1});h.inventory={model:'',cartridges:[...mats]};h.stockApplied=mats.length>0}else if(!h.inventory&&mats.length){if(mats.every(x=>qty('cartridge',x)>=1)){deductCartridges(mats);h.inventory={model:'',cartridges:[...mats]};h.stockApplied=true}}Object.assign(h,d)}else{if(mats.length&&!mats.every(x=>qty('cartridge',x)>=1)){alert('Нельзя сохранить: выбранных картриджей не хватает на складе.');return}deductCartridges(mats);c.history.unshift({id:Date.now().toString(),...d,stockAppli
