name: Сборка MoiFiltry APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
      - "main.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry 86
    runs-on: ubuntu-latest
    steps:
      - name: Получить текущий коммит репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Проверить что ZIP и workflow одной версии
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/main.yml
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен находиться ровно один ZIP-источник."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          ZIP_NAME="${ZIPS[0]}"
          WORKFLOW_VERSION="$(grep -oE 'Сборка MoiFiltry [0-9]+' .github/workflows/main.yml | head -n1 | grep -oE '[0-9]+$')"
          [[ -n "$WORKFLOW_VERSION" ]] || { echo "ОШИБКА: не удалось определить версию workflow"; exit 1; }
          [[ "$WORKFLOW_VERSION" = "86" ]] || { echo "ОШИБКА: ожидается workflow 86, найден $WORKFLOW_VERSION"; exit 1; }
          [[ "$ZIP_NAME" =~ ^MoiFiltry_86([_-].*)?\.zip$ ]] || { echo "ОШИБКА: ZIP не соответствует workflow 86: $ZIP_NAME"; exit 1; }
          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"
          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/moifiltry-project"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/moifiltry-project" -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "ОШИБКА: settings.gradle не найден"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/app/build.gradle"
          APP_ID="$(sed -n "s/.*applicationId ['\"][^'\"]*['\"].*/\1/p" "$PROJECT_DIR/app/build.gradle" | head -n 1)"
          VERSION_NAME="$(sed -n "s/.*versionName ['\"][^'\"]*['\"].*/\1/p" "$PROJECT_DIR/app/build.gradle" | head -n 1)"
          test "$APP_ID" = "kz.moifiltry.app.v86" || { echo "ОШИБКА: applicationId=$APP_ID"; exit 1; }
          test "$VERSION_NAME" = "8.6" || { echo "ОШИБКА: versionName=$VERSION_NAME"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Подтвержден источник: $ZIP_NAME"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Глубокая проверка 86
        shell: bash
        run: |
          set -
