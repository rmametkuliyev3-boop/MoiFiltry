name: Сборка MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Найти Android-проект
        run: |
          echo "Ищем settings.gradle..."
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Сделать gradlew исполняемым
        run: |
          chmod +x gradlew

      - name: Собрать APK
        run: |
          ./gradlew assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p output
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK не найден!"
            exit 1
          fi
          cp "$APK" output/MoiFiltry_71.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_71
          path: output/MoiFiltry_71.apk
          if-no-files-found: error
