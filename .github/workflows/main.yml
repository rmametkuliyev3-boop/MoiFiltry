name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry 84
    runs-on: ubuntu-latest
    steps:
      - name: Получить текущий коммит репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Проверить что запущена именно актуальная workflow 84
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" != "" || { echo "ОШИБКА: не определена ветка запуска"; exit 1; }
          echo "Запуск из ветки: ${GITHUB_REF_NAME}"
          echo "Коммит: ${GITHUB_SHA}"
          test -f .github/workflows/main.yml
          grep -Fq "Сборка MoiFiltry 84" .github/workflows/main.yml
          grep -Fq "MoiFiltry_84" .github/workflows/main.yml

      - name: Найти и проверить единственный ZIP-источник 84
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен находиться ровно один ZIP-источник."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          ZIP_NAME="${ZIPS[0]}"
          [[ "$ZIP_NAME" =~ ^MoiFiltry_84([_-].*)?\.zip$ ]] || { echo "ОШИБКА: найден не ZIP 84: $ZIP_NAME"; exit 1; }
          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"
          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/moifiltry-project"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/moifiltry-project" -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "ОШИБКА: settings.gradle не найден"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/app/build.gradle"
          APP_ID="$(sed -n "s/.*applicationId ['\"]\([^'\"]*\)['\"].*/\1/p" "$PROJECT_DIR/app/build.gradle" | head -n 1)"
          VERSION_NAME="$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" "$PROJECT_DIR/app/build.gradle" | head -n 1)"
          test "$APP_ID" = "kz.moifiltry.app.v84" || { echo "ОШИБКА: applicationId=$APP_ID"; exit 1; }
          test "$VERSION_NAME" = "8.4" || { echo "ОШИБКА: versionName=$VERSION_NAME"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Подтвержден источник: $ZIP_NAME"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Глубокая проверка 84
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -Fq "applicationId 'kz.moifiltry.app.v84'" app/build.gradle
          grep -Fq "versionName '8.4'" app/build.gradle
          grep -Fq "versionCode 28" app/build.gradle
          grep -Fq 'android:label="Мои Фильтры 84"' app/src/main/AndroidManifest.xml

          grep -Fq 'function financeFindDropTarget' app/src/main/assets/index.html
          grep -Fq 'getBoundingClientRect' app/src/main/assets/index.html
          grep -Fq 'function financePointerDown' app/src/main/assets/index.html
          grep -Fq 'function financePointerMove' app/src/main/assets/index.html
          grep -Fq 'function financeFinishDrag' app/src/main/assets/index.html
          grep -Fq 'function financeTouchStart' app/src/main/assets/index.html
          grep -Fq 'function financeTouchMove' app/src/main/assets/index.html
          grep -Fq 'function financeTouchEnd' app/src/main/assets/index.html

          grep -Fq 'financeSection{padding:7px 0 0;border-bottom:1px solid' app/src/main/assets/index.html
          grep -Fq 'Доходы</div><div class="financeRow">' app/src/main/assets/index.html
          grep -Fq 'Кошельки / счета</div><div class="financeRow">' app/src/main/assets/index.html
          grep -Fq 'Расходы</div><div class="financeRow">' app/src/main/assets/index.html

          grep -Fq 'Android.openMapChooser(clean)' app/src/main/assets/index.html
          ! grep -Fq "prompt('Открыть адрес" app/src/main/assets/index.html

          grep -Fq 'function serviceHistorySorted' app/src/main/assets/index.html
          grep -Fq 'function lastService' app/src/main/assets/index.html
          grep -Fq 'function completeTask' app/src/main/assets/index.html

          node --check script.js

          sed -n '/<script>/,/<\/script>/p' app/src/main/assets/index.html | sed '1d;$d' > "$RUNNER_TEMP/moifiltry-check.js"
          node --check "$RUNNER_TEMP/moifiltry-check.js"

          cmp -s "$RUNNER_TEMP/moifiltry-check.js" script.js || {
            echo "ОШИБКА: script.js и встроенный JS расходятся"
            exit 1
          }

      - name: Собрать APK 84
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Проверить единственный APK и подготовить 84
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ОШИБКА: ожидался ровно один APK, найдено: ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          cp "${APKS[0]}" "$GITHUB_WORKSPACE/MoiFiltry_84.apk"

      - name: Загрузить APK 84
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_84
          path: MoiFiltry_84.apk
          if-no-files-found: error
