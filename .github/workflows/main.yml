name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry 82
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Проверить актуальный workflow 82
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/main.yml

          grep -Fq "Сборка MoiFiltry 82" .github/workflows/main.yml
          grep -Fq "MoiFiltry_82" .github/workflows/main.yml

          echo "Workflow 82 подтверждён."
          echo "Ветка: ${GITHUB_REF_NAME}"
          echo "Коммит: ${GITHUB_SHA}"

      - name: Найти и проверить ZIP 82
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен быть ровно один ZIP."
            echo "Найдено ZIP: ${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_NAME="${ZIPS[0]}"

          if [[ ! "$ZIP_NAME" =~ ^MoiFiltry_82([_-].*)?\.zip$ ]]; then
            echo "ОШИБКА: найден не ZIP 82."
            echo "
