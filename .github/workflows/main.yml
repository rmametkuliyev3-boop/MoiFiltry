name: Сборка MoiFiltry 79

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка MoiFiltry 79
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Поиск ZIP-79
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n")

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен находиться ровно один ZIP."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          if [[ "$ZIP" != *79* ]]; then
            echo "ОШИБКА: найден не ZIP-79: $ZIP"
            exit 1
          fi

          echo "Используется исходник: $ZIP"

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Поиск Android-проекта
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Android-проект найден: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Проверка Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 найден."

      - name: Установка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Проверка версии MoiFiltry 79
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          grep -Eq "applicationId ['\"]kz\.moifiltry\.app\.v79['\"]" app/build.gradle
          grep -Eq "versionName ['\"]7\.9['\"]" app/build.gradle

          echo "Версия 79 подтверждена."

      - name: Проверка финансового интерфейса
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          INDEX="app/src/main/assets/index.html"

          test -f "$INDEX"

          grep -q "financeDrawer" "$INDEX"
          grep -q "financeMenuToggle" "$INDEX"
          grep -q "financeStatistics" "$INDEX"
          grep -q "financeHistory" "$INDEX"

          if grep -q "financeActionBar" "$INDEX"; then
            echo "ОШИБКА: старая нижняя панель финансов присутствует."
            exit 1
          fi

          if grep -q "Нажмите и перетащите" "$INDEX"; then
            echo "ОШИБКА: старая подсказка присутствует."
            exit 1
          fi

          echo "Финансовый интерфейс проверен."

      - name: Проверка JavaScript
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ -f script.js ]; then
            node --check script.js
          fi

          echo "JavaScript проверен."

      - name: Сборка APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug --no-daemon

      - name: Подготовка APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MoiFiltry_79.apk"

          ls -lh "$GITHUB_WORKSPACE/MoiFiltry_79.apk"

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_79
          path: MoiFiltry_79.apk
          if-no-files-found: error
