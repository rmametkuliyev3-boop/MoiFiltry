name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Проверить проект
        shell: bash
        run: |
          set -e

          echo "Проверяем Android-проект..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradlew
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          chmod +x gradlew

          echo "Проект найден."
          echo "Gradle Wrapper найден."

      - name: Собрать APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "СБОРКА МОИ ФИЛЬТРЫ 5.1"
          echo "======================================"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK УСПЕШНО СОЗДАН"
          echo "======================================"

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
