name: Сборка MoiFiltry 01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить проект
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Project files OK"

          grep -Eq "applicationId[[:space:]]+['\"]kz\.moifiltry\.app\.v67['\"]" app/build.gradle
          grep -Eq "versionCode[[:space:]]+19" app/build.gradle
          grep -Eq "versionName[[:space:]]+['\"]6\.7['\"]" app/build.gradle

          echo "Application version OK"

      - name: Собрать APK
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon

      - name: Подготовить APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          test -n "$APK"

          cp "$APK" MoiFiltry_01.apk

          echo "APK готов: MoiFiltry_01.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_01
          path: MoiFiltry_01.apk
          if-no-files-found: error
