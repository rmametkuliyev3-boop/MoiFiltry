name: Build MoiFiltry 5.1 APK

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Setup Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.7"

  - name: Find and unpack ZIP
    run: |
      set -e

      ZIP_FILE=$(find . -type f -name "*.zip" ! -path "./.git/*" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ZIP not found"
        exit 1
      fi

      echo "ZIP found: $ZIP_FILE"

      rm -rf extracted
      mkdir extracted

      unzip -q "$ZIP_FILE" -d extracted

      PROJECT_ROOT=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)

      if [ -z "$PROJECT_ROOT" ]; then
        echo "Android project root not found"
        exit 1
      fi

      echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

  - name: Build APK
    run: |
      set -e
      cd "$PROJECT_ROOT"
      gradle clean assembleDebug --stacktrace --no-daemon

  - name: Check APK
    run: |
      set -e

      APK=$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)

      if [ -z "$APK" ]; then
        echo "APK not found"
        exit 1
      fi

      test -s "$APK"

      echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MoiFiltry-5.1-APK
      path: ${{ env.APK_PATH }}
      if-no-files-found: error
