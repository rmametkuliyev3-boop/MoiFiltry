name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify project
        run: |
          set -e
          echo "Проверяем структуру проекта..."
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html
          echo "Структура проекта OK"

      - name: Verify required features before build
        run: |
          set -e
          FILE=app/src/main/assets/index.html

          echo "Проверяем обязательные функции..."

          grep -q "function deleteClient" "$FILE"
          grep -q "db.clients.splice" "$FILE"
          grep -q "function callClient" "$FILE"
          grep -q "public void call" app/src/main/java/kz/moifiltry/app/MainActivity.java
          grep -q "ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок OK"

          echo "Проверяем два нижних счетчика..."

          grep -q "bottomCounters" "$FILE"
          grep -q "todayCounter" "$FILE"
          grep -q "overdueCounter" "$FILE"
          grep -q "counterRing" "$FILE"
          grep -q "overdueCount" "$FILE"

          echo "Кружочки и логика просроченных заявок OK"

      - name: Build APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK and verify bundled HTML
        run: |
          set -e

          APK=app/build/outputs/apk/debug/app-debug.apk

          test -f "$APK"

          ls -lh "$APK"

          echo "Проверяем, что новый index.html попал внутрь APK..."

          rm -rf /tmp/apk-check
          mkdir -p /tmp/apk-check

          unzip -q "$APK" -d /tmp/apk-check

          BUNDLED=/tmp/apk-check/assets/index.html

          test -f "$BUNDLED"

          grep -q "bottomCounters" "$BUNDLED"
          grep -q "todayCounter" "$BUNDLED"
          grep -q "overdueCounter" "$BUNDLED"
          grep -q "counterRing" "$BUNDLED"
          grep -q "overdueCount" "$BUNDLED"

          echo "APK содержит новую версию с кружочками OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
