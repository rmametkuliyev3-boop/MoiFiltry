name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить Android проект
        run: |
          set -e
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          echo "Android project found"

      - name: Собрать APK
        run: |
          set -e
          gradle clean assembleDebug --no-daemon

      - name: Найти APK
        run: |
          set -e
          APK=$(find . -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" MoiFiltry_01.apk
          echo "APK найден: $APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_01
          path: MoiFiltry_01.apk
          if-no-files-found: error
