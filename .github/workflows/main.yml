name: Build MoiFiltry 69

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 69
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project and finance module
        run: |
          set -e

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          grep -Fq "applicationId 'kz.moifiltry.app.v69'" app/build.gradle
          grep -Fq 'versionCode 21' app/build.gradle
          grep -Fq "versionName '6.9'" app/build.gradle

          grep -Fq 'function financeHome' app/src/main/assets/index.html
          grep -Fq 'function financeOpenAddSheet' app/src/main/assets/index.html
          grep -Fq 'function financeSaveAddSheet' app/src/main/assets/index.html
          grep -Fq 'function financeOverview' app/src/main/assets/index.html
          grep -Fq 'financeOverviewYear' app/src/main/assets/index.html
          grep -Fq 'Технодом+' app/src/main/assets/index.html
          grep -Fq 'localStorage.setItem(FIN_KEY' app/src/main/assets/index.html
          grep -Fq 'Общее за' app/src/main/assets/index.html
          grep -Fq 'class="financeMenuBtn"' app/src/main/assets/index.html

          echo "Project and finance setup OK"

      - name: Build single APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MoiFiltry_69.apk
          rm app/build/outputs/apk/debug/app-debug.apk
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_69
          path: app/build/outputs/apk/debug/MoiFiltry_69.apk
          if-no-files-found: error
