name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project structure
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

          test -d app
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Структура проекта OK"

      - name: Check Android project
        run: |
          set -e

          grep -q "com.android.application" app/build.gradle
          grep -q "compileSdk 35" app/build.gradle
          grep -q "targetSdk 35" app/build.gradle
          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '5.1'" app/build.gradle

          echo "Настройки Android-проекта OK"

      - name: Check delete function
        run: |
          set -e

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "db.clients.splice(i,1)" app/src/main/assets/index.html
          grep -q "save()" app/src/main/assets/index.html

          echo "Кнопка Удалить OK"

      - name: Check call function
        run: |
          set -e

          grep -q "function callClient" app/src/main/assets/index.html
          grep -q "tel:" app/src/main/assets/index.html

          echo "Кнопка Позвонить OK"

      - name: Check WhatsApp
        run: |
          set -e

          grep -q "function wa" app/src/main/assets/index.html
          grep -q "Android.whatsapp" app/src/main/assets/index.html

          echo "WhatsApp OK"

      - name: Build APK
        run: |
          set -e

          echo "Начинаем сборку APK..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Check APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
