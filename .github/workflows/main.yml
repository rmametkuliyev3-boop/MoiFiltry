name: Сборка MoiFiltry APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
      - "main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moifiltry-build
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка текущего ZIP-источника
    runs-on: ubuntu-latest

    steps:
      - name: Получить текущий коммит репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Найти и распаковать текущий ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ОШИБКА: в корне должен находиться ровно один ZIP-источник."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_NAME="${ZIPS[0]}"

          [[ "$ZIP_NAME" =~ ^MoiFiltry_.*\.zip$ ]] || {
            echo "ОШИБКА: имя ZIP должно начинаться с MoiFiltry_: $ZIP_NAME"
            exit 1
          }

          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"

          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/moifiltry-project"

          SETTINGS_FILE="$(
            find "$RUNNER_TEMP/moifiltry-project" \
              -type f -name settings.gradle -print -quit
          )"

          test -n "$SETTINGS_FILE" || {
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/build.gradle" || {
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          }

          APP_ID="$(
            grep -E "^[[:space:]]*applicationId[[:space:]]+['\"]" \
              "$PROJECT_DIR/app/build.gradle" |
              head -n 1 |
              awk '{print $2}' |
              tr -d "'\""
          )"

          VERSION_NAME="$(
            grep -E "^[[:space:]]*versionName[[:space:]]+['\"]" \
              "$PROJECT_DIR/app/build.gradle" |
              head -n 1 |
              awk '{print $2}' |
              tr -d "'\""
          )"

          VERSION_CODE="$(
            grep -E "^[[:space:]]*versionCode[[:space:]]+" \
              "$PROJECT_DIR/app/build.gradle" |
              head -n 1 |
              awk '{print $2}'
          )"

          APP_VERSION="${APP_ID##*.v}"

          test -n "$APP_VERSION" || {
            echo "ОШИБКА: не удалось определить версию."
            exit 1
          }

          test "$APP_ID" = "kz.moifiltry.app.v$APP_VERSION" || {
            echo "ОШИБКА: неожиданный applicationId=$APP_ID"
            exit 1
          }

          echo "Найден ZIP: $ZIP_NAME"
          echo "applicationId: $APP_ID"
          echo "versionName: $VERSION_NAME"
          echo "versionCode: $VERSION_CODE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить текущий проект
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -Fq "applicationId 'kz.moifiltry.app.v$APP_VERSION'" app/build.gradle
          grep -Fq "versionName '$VERSION_NAME'" app/build.gradle

          grep -Fq 'function financeFindDropTarget' app/src/main/assets/index.html
          grep -Fq 'function financeFinishDrag' app/src/main/assets/index.html
          grep -Fq 'function financeTouchStart' app/src/main/assets/index.html
          grep -Fq 'function financeSaveCalculator' app/src/main/assets/index.html

          grep -Fq 'Android.chooseBackupFolder()' app/src/main/assets/index.html
          grep -Fq 'Android.autoBackup' app/src/main/assets/index.html
          grep -Fq 'savedAt:new Date().toISOString()' app/src/main/assets/index.html

          grep -Fq 'function saveClient' app/src/main/assets/index.html
          grep -Fq 'function clientSearchMatch' app/src/main/assets/index.html
          grep -Fq 'function serviceHistoryList' app/src/main/assets/index.html
          grep -Fq "['PP5','GAC','CTO']" app/src/main/assets/index.html
          grep -Fq 'function home()' app/src/main/assets/index.html
          grep -Fq 'historyInstall' app/src/main/assets/index.html
          grep -Fq 'function completeTask' app/src/main/assets/index.html

      - name: Gradle 8.7 — собрать APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Проверить APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f -name '*.apk' | sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ОШИБКА: должен быть ровно один APK."
            echo "Найдено: ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          cp "${APKS[0]}" "$GITHUB_WORKSPACE/MoiFiltry_${APP_VERSION}.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_${{ env.APP_VERSION }}
          path: MoiFiltry_${{ env.APP_VERSION }}.apk
          if-no-files-found: error
