name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить структуру проекта
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          echo "Структура проекта OK"

      - name: Проверить Gradle
        run: |
          set -e
          gradle --version

      - name: Проверить версию приложения
        run: |
          set -e
          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '5.1'" app/build.gradle
          echo "Версия 5.1 OK"

      - name: Проверить функции удаления и звонка
        run: |
          set -e

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "tel:" app/src/main/assets/index.html
          grep -q "ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок проверены."

      - name: Собрать APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Проверить APK
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK создан успешно:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
