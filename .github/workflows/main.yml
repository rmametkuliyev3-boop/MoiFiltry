name: Build MoiFiltry 70

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 70
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project
        run: |
          set -e

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            ARCHIVE=$(find . -type f -name "*.zip" -not -path "./.git/*" -print -quit || true)
            if [ -z "$ARCHIVE" ]; then
              echo "Android project or project ZIP not found"
              exit 1
            fi

            mkdir -p .android_source
            unzip -q "$ARCHIVE" -d .android_source
          fi

          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" -print -quit)
          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name "app-debug.apk" -print -quit)
          test -n "$APK"
          cp "$APK" "$PROJECT_DIR/app/build/outputs/apk/debug/MoiFiltry_70.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_70
          path: "**/app/build/outputs/apk/debug/MoiFiltry_70.apk"
          if-no-files-found: error
