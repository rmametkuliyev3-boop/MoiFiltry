name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Проверяем структуру проекта
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          echo "Корень:"
          pwd

          echo ""
          echo "Файлы проекта:"
          find . -maxdepth 4 -type f | sort

          echo ""

          if [ ! -f "settings.gradle" ]; then
            echo "ОШИБКА: settings.gradle не найден"
            exit 1
          fi

          if [ ! -f "build.gradle" ]; then
            echo "ОШИБКА: build.gradle не найден"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ОШИБКА: папка app не найдена"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ОШИБКА: app/build.gradle не найден"
            exit 1
          fi

          echo "Структура проекта корректная."

      - name: Устанавливаем Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверяем Gradle
        run: |
          set -e
          gradle --version

      - name: Сборка APK
        run: |
          set -e

          echo "Начинаем сборку MoiFiltry..."

          gradle assembleDebug --stacktrace

      - name: Проверяем APK
        run: |
          set -e

          echo "Ищем готовый APK..."

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo ""
          echo "APK найден:"
          echo "$APK"

          echo ""
          echo "Размер APK:"
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "Размер APK: $SIZE байт"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ОШИБКА: APK подозрительно маленький."
            exit 1
          fi

          echo "APK успешно собран."

      - name: Загружаем APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
