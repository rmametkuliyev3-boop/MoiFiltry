name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "Ищем ZIP проекта..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден."
            exit 1
          fi

          echo "Найден ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_PATH=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unpack project
        shell: bash
        run: |
          set -e

          echo "Распаковываем проект..."

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_PATH" -d project

          echo "Содержимое после распаковки:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Ищем gradlew..."

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ОШИБКА: файл gradlew не найден."
            echo "Структура распакованного проекта:"
            find project -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project найден:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Проверяем структуру проекта
        shell: bash
        run: |
          set -e

          echo "Проверяем структуру проекта..."
          echo "Корень проекта: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "Файлы проекта:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Проверяем gradlew..."

          if [ ! -f "./gradlew" ]; then
            echo "ОШИБКА: gradlew отсутствует."
            exit 1
          fi

          echo "gradlew найден."

          echo ""
          echo "Проверяем settings.gradle..."

          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "ОШИБКА: settings.gradle или settings.gradle.kts отсутствует."
            exit 1
          fi

          echo "settings.gradle найден."

          echo ""
          echo "Проверяем папку app..."

          if [ ! -d "./app" ]; then
            echo "ОШИБКА: папка app отсутствует."
            exit 1
          fi

          echo "Папка app найдена."

          chmod +x ./gradlew

          echo ""
          echo "Структура проекта корректная."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Запускаем сборку APK..."

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "Ищем готовый APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден."
            exit 1
          fi

          echo ""
          echo "APK найден:"
          echo "$APK"

          echo ""
          echo "Размер APK:"
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "Размер в байтах: $SIZE"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ОШИБКА: APK подозрительно маленький."
            exit 1
          fi

          echo "APK выглядит нормально."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-full-project
          path: ${{ env.PROJECT_DIR }}
          if-no-files-found: error
