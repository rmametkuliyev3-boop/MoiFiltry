name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP проекта не найден"
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Распаковываем проект
        run: |
          set -e

          rm -rf android_project
          mkdir android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "ZIP распакован."
          find android_project -maxdepth 6 -type f | sort

      - name: Находим Android проект
        run: |
          set -e

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ОШИБКА: settings.gradle не найден внутри ZIP"
            find android_project -maxdepth 8 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Проект найден: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Проверяем проект
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -d app || {
            echo "ОШИБКА: папка app не найдена"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ОШИБКА: app/build.gradle не найден"
            exit 1
          }

          echo "Проект проверен успешно."

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Сборка APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Запускаем сборку MoiFiltry..."

          gradle assembleDebug --stacktrace

      - name: Проверяем APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "================================"
          echo "APK ГОТОВ"
          echo "================================"
          echo "$APK"
          ls -lh "$APK"

      - name: Загружаем APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
