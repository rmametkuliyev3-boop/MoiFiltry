name: Build MoiFiltry APK 13

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        run: |
          set -e

          echo "Проверяем Android-проект..."

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Файлы проекта OK"

          grep -Fq "applicationId 'kz.moifiltry.app.v63'" app/build.gradle
          grep -Fq "versionCode 11" app/build.gradle
          grep -Fq "versionName '6.3'" app/build.gradle

          echo "Пакет и версия OK"

          grep -Fq "function phoneDigits" app/src/main/assets/index.html
          grep -Fq "Android.call(p)" app/src/main/assets/index.html
          grep -Fq "Android.whatsapp('7'+p.slice(1))" app/src/main/assets/index.html

          echo "Телефонная логика OK"

          if grep -Fq '<span>+7</span>' app/src/main/assets/index.html; then
            echo "ОШИБКА: старый префикс +7 найден"
            exit 1
          fi

          echo "Старый префикс +7 отсутствует"
          echo "Проверка проекта завершена успешно"

      - name: Build single APK
        run: |
          set -e

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          APK_COUNT=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ОШИБКА: найдено APK: $APK_COUNT"
            exit 1
          fi

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "Один APK успешно создан"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-13-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
