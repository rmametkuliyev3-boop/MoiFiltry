name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Распаковать ZIP
        run: |
          set -e

          ZIP_FILE="MoiFiltry_5_1_FIXED_FINAL.zip"

          test -f "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Проверяем структуру..."

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/gradle.properties
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

          echo "Проект найден."

      - name: Проверить исправления
        run: |
          set -e

          grep -q "function deleteClient" \
            project/app/src/main/assets/index.html

          grep -q "function callClient" \
            project/app/src/main/assets/index.html

          grep -q "ACTION_DIAL" \
            project/app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок проверены."

      - name: Build Debug APK
        working-directory: project
        run: |
          set -e

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить APK
        run: |
          set -e

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "APK создан:"
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Артефакт 1 — APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Артефакт 2 — весь APK каталог
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-apk-output
          path: project/app/build/outputs/apk/

      - name: Артефакт 3 — исходники приложения
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-app
          path: project/app/

      - name: Артефакт 4 — Gradle файлы
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-gradle
          path: |
            project/settings.gradle
            project/build.gradle
            project/gradle.properties
            project/app/build.gradle

      - name: Артефакт 5 — AndroidManifest
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-manifest
          path: project/app/src/main/AndroidManifest.xml

      - name: Артефакт 6 — полный распакованный проект
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-project
          path: project/
