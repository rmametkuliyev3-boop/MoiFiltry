name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти и распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          test -n "$ZIP_FILE" || {
            echo "Ошибка: ZIP проекта не найден в корне репозитория"
            exit 1
          }

          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/moifiltry-project"

          SETTINGS_FILE="$(
            find "$RUNNER_TEMP/moifiltry-project" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit
          )"

          test -n "$SETTINGS_FILE" || {
            echo "Ошибка: settings.gradle(.kts) не найден внутри ZIP"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android-проект: $PROJECT_DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME" || {
            echo "Ошибка: Android SDK не найден"
            exit 1
          }

          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "Ошибка: Android SDK Platform 35 не найден"
            exit 1
          }

          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo "Ошибка: Build Tools 35.0.0 не найден"
            exit 1
          }

          test -x "$ANDROID_HOME/platform-tools/adb" || {
            echo "Ошибка: platform-tools не найдены"
            exit 1
          }

          echo "Android SDK 35 готов"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить исходник и ключевые функции
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -Fq "applicationId 'kz.moifiltry.app.v75'" app/build.gradle
          grep -Fq "versionName '7.5'" app/build.gradle

          grep -Fq 'addressExtra' app/src/main/assets/index.html
          grep -Fq 'function completeTask' app/src/main/assets/index.html
          grep -Fq 'function replacementBaseDate' app/src/main/assets/index.html

          grep -Fq 'function financeMenuToggle' app/src/main/assets/index.html
          grep -Fq 'function financeOverview' app/src/main/assets/index.html
          grep -Fq 'function financeStatistics' app/src/main/assets/index.html
          grep -Fq 'function financeHistory' app/src/main/assets/index.html
          grep -Fq 'function financeCloseMenu' app/src/main/assets/index.html

          grep -Fq 'document.addEventListener' app/src/main/assets/index.html
          grep -Fq 'История обслуживания' app/src/main/assets/index.html
          grep -Fq 'financeMenu' app/src/main/assets/index.html

          echo "Проверка исходника и ключевых функций пройдена"

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Проверить и подготовить APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK" || {
            echo "Ошибка: APK не создан"
            exit 1
          }

          cp "$APK" "$GITHUB_WORKSPACE/MoiFiltry_75.apk"

          ls -lh "$GITHUB_WORKSPACE/MoiFiltry_75.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_75
          path: MoiFiltry_75.apk
          if-no-files-found: error
          retention-days: 7
