name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        shell: bash
        run: |
          set -e
          echo "=== Repository root ==="
          pwd

          echo
          echo "=== Files ==="
          find . -maxdepth 4 -type f -not -path './.git/*' | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and unpack project ZIP
        id: project
        shell: bash
        run: |
          set -e

          echo "=== Searching for ZIP files ==="

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            -not -path "*/.git/*" \
            -print \
            | sort)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            mkdir -p "$GITHUB_WORKSPACE/unpacked"

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/unpacked"

            echo "ZIP unpacked."
          else
            echo "No ZIP found. Using repository files directly."
          fi

          echo
          echo "=== Searching for settings.gradle ==="

          SETTINGS_FILE=""

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              SETTINGS_FILE="$file"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "settings.gradle" \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            -print \
            | sort)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."

            echo
            echo "=== Complete project tree ==="
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              -not -path "*/.git/*" \
              | sort

            exit 1
          fi

          ROOT="$(dirname "$SETTINGS_FILE")"

          echo "Android project root:"
          echo "$ROOT"

          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"

          echo
          echo "Project structure OK."

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.root }}"

          echo "=== Checking required files ==="

          REQUIRED_FILES=(
            "$ROOT/settings.gradle"
            "$ROOT/build.gradle"
            "$ROOT/gradle.properties"
            "$ROOT/app/build.gradle"
            "$ROOT/app/src/main/AndroidManifest.xml"
            "$ROOT/app/src/main/assets/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.root }}"

          if command -v node >/dev/null 2>&1; then
            node --check "$ROOT/app/src/main/assets/index.html" 2>/dev/null || true
          fi

          echo "JavaScript check completed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.root }}"

          cd "$ROOT"

          echo "=== Gradle version ==="
          gradle --version

          echo
          echo "=== Building APK ==="

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Check APK
        id: apk
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.root }}"

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-debug.apk was not created."

            echo
            echo "=== Build output ==="
            find "$ROOT/app/build" \
              -type f \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but is empty."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "APK successfully created."
          echo "APK size: $SIZE bytes"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
