name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Распаковать проект
        run: |
          mkdir -p project
          unzip -q "Мои Фильтры 2 Android.zip" -d project
          echo "Проект распакован:"
          find project -maxdepth 3 -type f | head -100

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
