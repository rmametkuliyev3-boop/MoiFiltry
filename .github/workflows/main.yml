name: Сборка MoiFiltry 82

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Проверить ZIP 82
        shell: bash
        run: |
          set -e

          ZIP_COUNT=$(find . -maxdepth 1 -type f -name "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ОШИБКА: в корне репозитория должен быть ровно один ZIP."
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          ZIP_NAME=$(find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n")

          echo "Найден ZIP: $ZIP_NAME"

          if ! printf "%s" "$ZIP_NAME" | grep -Fq "MoiFiltry_82"; then
            echo "ОШИБКА: найден не ZIP версии 82."
            echo "Ожидалось имя, содержащее MoiFiltry_82"
            exit 1
          fi

          echo "ZIP версии 82 найден."

      - name: Распаковать ZIP
        shell: bash
        run: |
          set -e

          ZIP_NAME=$(find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n")

          rm -rf project
          mkdir project

          unzip -q "$ZIP_NAME" -d project

          echo "ZIP распакован."

      - name: Найти Android проект
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ОШИБКА: settings.gradle или settings.gradle.kts не найден."
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android проект: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Проверить структуру проекта
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle" || test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Основные файлы проекта найдены."

      - name: Проверить версию приложения
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if ! grep -Fq "kz.moifiltry.app.v82" "$BUILD_FILE"; then
            echo "ОШИБКА: applicationId версии 82 не найден."
            grep -n "applicationId" "$BUILD_FILE" || true
            exit 1
          fi

          if ! grep -Eq "versionName[[:space:]]+['\"]8\.2['\"]" "$BUILD_FILE"; then
            echo "ОШИБКА: versionName 8.2 не найден."
            grep -n "versionName" "$BUILD_FILE" || true
            exit 1
          fi

          echo "applicationId и versionName соответствуют версии 82."

      - name: Проверить JavaScript
        shell: bash
        run: |
          set -e

          node --check "$PROJECT_DIR/script.js"

          echo "JavaScript проверен."

      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Настроить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Проверить Java и Gradle
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

      - name: Собрать APK 82
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean assembleDebug --no-daemon

      - name: Проверить APK
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "ОШИБКА: ожидался ровно один APK."
            find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print
            exit 1
          fi

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          mkdir -p release
          cp "$APK" release/MoiFiltry_82.apk

          echo "APK готов:"
          ls -lh release/MoiFiltry_82.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_82
          path: release/MoiFiltry_82.apk
          if-no-files-found: error
