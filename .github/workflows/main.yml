name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Распаковать Android-проект
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "РАСПАКОВКА ANDROID-ПРОЕКТА"
          echo "======================================"

          test -f "MoiFiltry_5.1_READY.zip"

          rm -rf project_unpacked
          mkdir -p project_unpacked

          unzip -q "MoiFiltry_5.1_READY.zip" -d project_unpacked

          echo ""
          echo "Содержимое ZIP:"
          find project_unpacked -maxdepth 5 -type f | sort

      - name: Найти Android-проект
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ПОИСК ANDROID-ПРОЕКТА"
          echo "======================================"

          GRADLEW_PATH=$(find project_unpacked -type f -name "gradlew" | head -n 1 || true)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ОШИБКА: файл gradlew не найден внутри ZIP."
            echo ""
            echo "Проверяем содержимое ZIP:"
            find project_unpacked -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo "Gradle найден:"
          echo "$GRADLEW_PATH"

          echo "Корень Android-проекта:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Принять лицензии Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Установить Android SDK компоненты
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Проверить Android-проект
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ПРОВЕРКА ANDROID-ПРОЕКТА"
          echo "======================================"

          echo "Папка проекта:"
          pwd

          echo ""
          echo "Файлы:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "Проверяем Gradle Wrapper..."

          test -f "./gradlew"
          chmod +x "./gradlew"

          echo "OK: gradlew"

          if [ -f "./settings.gradle" ]; then
            echo "OK: settings.gradle"
          elif [ -f "./settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          fi

          if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            echo "OK: основной build.gradle"
          else
            echo "ОШИБКА: основной build.gradle не найден."
            exit 1
          fi

          test -d "./app"
          echo "OK: папка app"

          if [ -f "./app/build.gradle" ]; then
            echo "OK: app/build.gradle"
          elif [ -f "./app/build.gradle.kts" ]; then
            echo "OK: app/build.gradle.kts"
          else
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ANDROID-ПРОЕКТ ПРОВЕРЕН"
          echo "======================================"

      - name: Очистить проект
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Собрать APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "СБОРКА APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Найти APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ГОТОВЫЕ APK"
          echo "======================================"

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
