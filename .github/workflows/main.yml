name: Сборка MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Сборка MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Найти и распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          echo "Содержимое репозитория:"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден."
            exit 1
          fi

          echo "Найден ZIP:"
          echo "$ZIP_FILE"

          EXTRACT_DIR="$GITHUB_WORKSPACE/_android_project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Ищем Android-проект..."

          SETTINGS_FILE="$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: после распаковки settings.gradle не найден."

            echo "Структура распакованного ZIP:"
            find "$EXTRACT_DIR" -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "Android-проект найден:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Проверить структуру Android-проекта
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Структура проекта: OK"

      - name: Проверить ключевые функции
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "db.clients.splice" app/src/main/assets/index.html
          grep -q "function callClient" app/src/main/assets/index.html
          grep -q "ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок: OK"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить APK и подпись
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не создан."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          if [ "$SIZE" -le 10000 ]; then
            echo "ОШИБКА: APK слишком маленький: $SIZE байт"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK успешно создан."
          echo "Размер: $SIZE байт"
          echo "Подпись APK: OK"

      - name: Подготовить APK
        shell: bash
        run: |
          set -euo pipefail

          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

          ls -lh "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: MoiFiltry-5.1.apk
          if-no-files-found: error
          compression-level: 0

      - name: Создать GitHub Release с APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moifiltry-5.1-build-${{ github.run_number }}
          name: MoiFiltry 5.1 — сборка ${{ github.run_number }}
          generate_release_notes: false
          files: MoiFiltry-5.1.apk
