name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Распаковать проект
        run: |
          set -e

          echo "Ищем ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP-файл не найден"
            exit 1
          fi

          echo "Найден: $ZIP_FILE"

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "Проверяем Android-проект..."

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/gradle.properties
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

          echo "Android-проект найден."

      - name: Проверить удаление и звонок
        working-directory: project
        run: |
          set -e

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "db.clients.splice" app/src/main/assets/index.html
          grep -q "function callClient" app/src/main/assets/index.html
          grep -q "ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок OK"

      - name: Собрать APK
        working-directory: project
        run: |
          set -e

          echo "Запускаем сборку APK..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить APK
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
