name: Сборка MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Найти и распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          echo "Содержимое репозитория:"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден."
            exit 1
          fi

          echo "Найден ZIP:"
          echo "$ZIP_FILE"

          EXTRACT_DIR="$GITHUB_WORKSPACE/_android_project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Распаковываем ZIP..."
          unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Ищем settings.gradle / settings.gradle.kts..."

          SETTINGS_FILE="$(find "$EXTRACT_DIR" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: после распаковки settings.gradle не найден."

            echo "Структура распакованного ZIP:"
            find "$EXTRACT_DIR" -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "Android-проект найден:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Проверить структуру Android-проекта
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Проверяем:"
          echo "  $PWD"

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ОШИБКА: основной build.gradle не найден."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          fi

          test -f "app/src/main/AndroidManifest.xml"
          test -f "app/src/main/assets/index.html"
          test -f "app/src/main/java/kz/moifiltry/app/MainActivity.java"

          echo "Структура Android-проекта: OK"

      - name: Проверить функции приложения
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          HTML="app/src/main/assets/index.html"
          JAVA="app/src/main/java/kz/moifiltry/app/MainActivity.java"

          echo "Проверяем HTML..."

          grep -q "function deleteClient" "$HTML"
          grep -q "function callClient" "$HTML"

          echo "Проверяем Android-код..."

          grep -q "ACTION_DIAL" "$JAVA"

          echo "Базовые функции проверены: OK"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Начинаем сборку..."
          echo "Проект: $PWD"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Проверить готовый APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не создан."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          if [ "$SIZE" -le 1000 ]; then
            echo "ОШИБКА: APK подозрительно маленький."
            exit 1
          fi

          echo "======================================"
          echo "APK УСПЕШНО СОЗДАН"
          echo "Размер: $SIZE байт"
          echo "======================================"

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
