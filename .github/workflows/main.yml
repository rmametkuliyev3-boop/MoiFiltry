name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry 82
    runs-on: ubuntu-latest

    steps:

      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Проверить ZIP 82
        shell: bash
        run: |
          set -euo pipefail

          ZIP_COUNT=$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ОШИБКА: в корне должен быть ровно один ZIP."
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          ZIP_NAME=$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n')

          case "$ZIP_NAME" in
            MoiFiltry_82*.zip)
              echo "Найден правильный ZIP: $ZIP_NAME"
              ;;
            *)
              echo "ОШИБКА: найден не ZIP 82."
              echo "Найден: $ZIP_NAME"
              exit 1
              ;;
          esac

          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"

          unzip -q "$ZIP_NAME" -d "$RUNNER_TEMP/moifiltry-project"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/moifiltry-project" -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          fi

          echo "Android-проект найден:"
          echo "$PROJECT_DIR"

          if ! grep -Fq "applicationId 'kz.moifiltry.app.v82'" "$PROJECT_DIR/app/build.gradle"; then
            echo "ОШИБКА: applicationId не соответствует версии 82."
            exit 1
          fi

          if ! grep -Fq "versionName '8.2'" "$PROJECT_DIR/app/build.gradle"; then
            echo "ОШИБКА: versionName не соответствует 8.2."
            exit 1
          fi

          echo "Версия 82 подтверждена."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "ОШИБКА: Android SDK 35 не найден."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "ОШИБКА: Build Tools 35.0.0 не найдены."
            exit 1
          fi

          echo "Android SDK OK."

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить структуру проекта
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Структура проекта OK."

      - name: Проверить версию 82
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -Fq "applicationId 'kz.moifiltry.app.v82'" app/build.gradle
          grep -Fq "versionName '8.2'" app/build.gradle

          echo "applicationId 82 OK."
          echo "versionName 8.2 OK."

      - name: Проверить JavaScript
        shell: bash
