name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Принять лицензии Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Установить Android SDK компоненты
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Проверить структуру проекта
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ПРОВЕРКА ANDROID-ПРОЕКТА"
          echo "======================================"

          echo "Текущая папка:"
          pwd

          echo ""
          echo "Файлы проекта:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "======================================"
          echo "ПРОВЕРЯЕМ GRADLE"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper найден."
            chmod +x ./gradlew
          else
            echo "ОШИБКА: gradlew не найден."
            echo "Содержимое корня проекта:"
            ls -la
            exit 1
          fi

          if [ -f "./settings.gradle" ]; then
            echo "OK: settings.gradle"
          elif [ -f "./settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ОШИБКА: settings.gradle или settings.gradle.kts не найден."
            exit 1
          fi

          if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            echo "OK: основной build.gradle"
          else
            echo "ОШИБКА: основной build.gradle не найден."
            exit 1
          fi

          if [ -d "./app" ]; then
            echo "OK: папка app"
          else
            echo "ОШИБКА: папка app не найдена."
            exit 1
          fi

          if [ -f "./app/build.gradle" ] || [ -f "./app/build.gradle.kts" ]; then
            echo "OK: app/build.gradle"
          else
            echo "ОШИБКА: app/build.gradle не найден."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ПРОЕКТ ПРОШЕЛ ПРОВЕРКУ"
          echo "======================================"

      - name: Очистить предыдущую сборку
        run: |
          ./gradlew clean

      - name: Собрать APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Найти APK
        shell: bash
        run: |
          echo "======================================"
          echo "ГОТОВЫЕ APK"
          echo "======================================"

          find . -type f -name "*.apk" -print

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
