name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Ищем Android-проект..."

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND_SETTINGS=$(find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: settings.gradle / settings.gradle.kts не найден."
            echo "Текущая структура:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android-проект найден:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Проверяем структуру проекта..."

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ОШИБКА: отсутствует settings.gradle / settings.gradle.kts"
            exit 1
          fi

          test -f "build.gradle" || test -f "build.gradle.kts"
          test -f "gradle.properties"
          test -f "app/build.gradle" || test -f "app/build.gradle.kts"
          test -f "app/src/main/AndroidManifest.xml"
          test -f "app/src/main/java/kz/moifiltry/app/MainActivity.java"
          test -f "app/src/main/assets/index.html"

          echo ""
          echo "Структура проекта OK."
          echo ""
          echo "Найденные основные файлы:"
          find . -maxdepth 4 -type f | sort

      - name: Verify application code
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Проверяем функции удаления и звонка..."

          grep -q "function deleteClient" \
            app/src/main/assets/index.html

          grep -q "db.clients.splice" \
            app/src/main/assets/index.html

          grep -q "function callClient" \
            app/src/main/assets/index.html

          grep -q "public void call" \
            app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -q "ACTION_DIAL" \
            app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок OK."

      - name: Check project configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Проверяем конфигурацию Android..."

          grep -q "compileSdk 35" app/build.gradle
          grep -q "JavaVersion.VERSION_17" app/build.gradle
          grep -q "JavaVersion.VERSION_17" app/build.gradle

          echo "Конфигурация Android OK."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Запускаем сборку MoiFiltry 5.1..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не создан."
            echo "Содержимое outputs:"
            find app/build/outputs -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo ""
          echo "APK успешно создан:"
          ls -lh "$APK"

          echo ""
          echo "Проверка APK:"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

**Я дополнительно сверил этот workflow с фактическим ZIP:** в нём действительно есть `settings.gradle`, `build.gradle`, `app/build.gradle`, `AndroidManifest.xml`, `MainActivity.java` и `index.html`, а нужные функции удаления и звонка присутствуют.

То есть здесь мы **не лечим симптомы наугад** — исправляем именно тот участок, на котором упал твой последний Actions.

Поставь этот файл вместо текущего `main.yml` и запусти Actions заново. Если снова будет ошибка, **пришли мне ссылку на новый запуск** — я разберу уже конкретную следующую ошибку, а не буду менять приложение вслепую.
