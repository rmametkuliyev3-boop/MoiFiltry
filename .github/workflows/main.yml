name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project root
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "settings.gradle" \
            -not -path "*/.git/*" \
            -print \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS_FILE")"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.root }}"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Find and check APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.project.outputs.root }}/app/build/outputs" \
            -type f \
            -name "app-debug.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk not found"
            find "${{ steps.project.outputs.root }}/app/build" -type f 2>/dev/null | sort || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but has zero size"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "APK found:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
