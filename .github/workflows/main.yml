name: Сборка MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MoiFiltry_5_1_UI_CIRCLES_HISTORY_FINAL.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v6

      - name: Настроить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Настроить Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Найти и распаковать правильный ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name 'MoiFiltry_5_1_UI_CIRCLES_HISTORY_FINAL.zip' -print)

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ОШИБКА: найдено ZIP-файлов с точным именем: ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          rm -rf _android_project
          mkdir -p _android_project
          unzip -q "${ZIP_FILES[0]}" -d _android_project

          PROJECT_DIR="$(find _android_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || { [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; }; then
            echo "ОШИБКА: Android-проект со settings.gradle/settings.gradle.kts не найден после распаковки."
            find _android_project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Проект найден: $PROJECT_DIR"

      - name: Проверить исходник до сборки
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          test -f build.gradle

          grep -Fq "applicationId 'kz.moifiltry.app51'" app/build.gradle
          grep -Fq "versionName '5.1'" app/build.gradle
          grep -Fq "versionCode 9" app/build.gradle

          grep -Fq 'id="todayCircle"' app/src/main/assets/index.html
          grep -Fq 'id="overdueCircle"' app/src/main/assets/index.html
          grep -Fq 'class="fab"' app/src/main/assets/index.html
          grep -Fq '>+</button>' app/src/main/assets/index.html
          grep -Fq 'function updateTaskCounters()' app/src/main/assets/index.html
          grep -Fq 'function completeService(i)' app/src/main/assets/index.html
          grep -Fq 'История обслуживания' app/src/main/assets/index.html

          grep -Fq "const cartridges=['PP5','GAC','CTO','PP1','Пост-фильтр','Минерализатор','Мембрана'];" app/src/main/assets/index.html

          echo 'Проверка исходника: OK'

      - name: Проверить Gradle-проект
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon --stacktrace help

      - name: Собрать Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleRelease

          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_UNSIGNED"
          echo "APK_UNSIGNED=$PROJECT_DIR/$APK_UNSIGNED" >> "$GITHUB_ENV"

      - name: Подписать APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          KEYSTORE="$RUNNER_TEMP/moifiltry-release.jks"
          UNSIGNED="$APK_UNSIGNED"
          ALIGNED="$RUNNER_TEMP/moifiltry-aligned.apk"
          SIGNED="$RUNNER_TEMP/MoiFiltry-5.1.apk"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias moifiltry \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MoiFiltry, OU=App, O=MoiFiltry, L=Almaty, ST=Almaty, C=KZ"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias moifiltry \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"

          test -s "$SIGNED"
          cp "$SIGNED" "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

          echo "Подписанный APK: $GITHUB_WORKSPACE/MoiFiltry-5.1.apk"
          ls -lh "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

      - name: Проверить APK перед публикацией
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="$GITHUB_WORKSPACE/MoiFiltry-5.1.apk"

          test -x "$AAPT"
          test -s "$APK"

          BADGING="$RUNNER_TEMP/badging.txt"
          "$AAPT" dump badging "$APK" > "$BADGING"

          grep -Fq "package: name='kz.moifiltry.app51'" "$BADGING"
          grep -Fq "versionCode='9'" "$BADGING"
          grep -Fq "versionName='5.1'" "$BADGING"

          echo 'Проверка APK: OK'
          grep -E "package: name=|versionCode=|versionName=" "$BADGING" | head -n 1

      - name: Загрузить APK в Артефакты
        uses: actions/upload-artifact@v5
        with:
          name: MoiFiltry-5.1-APK
          path: MoiFiltry-5.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="moifiltry-5.1-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/MoiFiltry-5.1.apk" \
            --title "MoiFiltry 5.1 — Build ${GITHUB_RUN_NUMBER}" \
            --notes "Готовый подписанный APK MoiFiltry 5.1. Package: kz.moifiltry.app51. Build: ${GITHUB_RUN_NUMBER}."
