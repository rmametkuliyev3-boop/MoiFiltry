name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project
        run: |
          set -e

          echo "Ищем настоящий корень Android-проекта..."

          PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: settings.gradle не найден."
            echo "Содержимое репозитория:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Найден проект: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -e

          echo "Сборка из: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        run: |
          set -e

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
