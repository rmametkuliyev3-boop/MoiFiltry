name: Build MoiFiltry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find project root
        run: |
          set -e
          echo "Ищем settings.gradle..."
          PROJECT_ROOT=$(find . -name settings.gradle -type f -not -path './.git/*' | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
            PROJECT_ROOT="."
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Корень проекта: $PROJECT_ROOT"

      - name: Check project structure
        run: |
          set -e

          echo "Проверяем структуру проекта..."

          test -f "$PROJECT_ROOT/settings.gradle"
          test -f "$PROJECT_ROOT/build.gradle"
          test -f "$PROJECT_ROOT/app/build.gradle"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_ROOT/app/src/main/java/com/example/moyfiltr/MainActivity.java"
          test -f "$PROJECT_ROOT/app/src/main/assets/index.html"

          echo "Структура проекта OK."

      - name: Make gradlew executable
        run: |
          set -e
          chmod +x "$PROJECT_ROOT/gradlew"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          set -e

          APK=$(find "$PROJECT_ROOT" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "APK найден: $APK"
          echo "Размер APK: $SIZE bytes"

          if [ "$SIZE" -le 0 ]; then
            echo "ОШИБКА: APK пустой."
            exit 1
          fi

          echo "APK проверен успешно."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
