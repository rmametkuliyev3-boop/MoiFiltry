name: Сборка MoiFiltry APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Сборка MoiFiltry APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать ZIP проекта
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл проекта не найден в корне репозитория"
            ls -la
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"
          rm -rf "$RUNNER_TEMP/moifiltry-project"
          mkdir -p "$RUNNER_TEMP/moifiltry-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/moifiltry-project"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/moifiltry-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: внутри ZIP не найден settings.gradle/settings.gradle.kts"
            find "$RUNNER_TEMP/moifiltry-project" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Android-проект найден: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          echo "Android SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ОШИБКА: Android SDK не найден"
            exit 1
          fi

          SDKMANAGER=""

          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do

            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            echo "sdkmanager найден: $SDKMANAGER"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager на runner не найден. Проверяем уже установленные компоненты."
          fi

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/platform-tools"

          echo "Android SDK 35 готов"

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить проект и функции
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java

          grep -Fq 'addressExtra' app/src/main/assets/index.html
          grep -Fq 'История обслуживания' app/src/main/assets/index.html
          grep -Fq 'function completeTask' app/src/main/assets/index.html
          grep -Fq 'function replacementBaseDate' app/src/main/assets/index.html

          echo "Проект и ключевые функции проверены"

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Подготовить APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/MoiFiltry_01.apk"

          ls -lh "$GITHUB_WORKSPACE/MoiFiltry_01.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_01
          path: MoiFiltry_01.apk
          if-no-files-found: error
          retention-days: 7
