name: Build MoiFiltry 70

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 70
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          set -e
          SETTINGS=$(find . -type f -name "settings.gradle" -print -quit)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find . -type f -name "settings.gradle.kts" -print -quit)
          fi
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$PROJECT_DIR/app/build/outputs/apk/debug/MoiFiltry_70.apk"
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/MoiFiltry_70.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_70
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/MoiFiltry_70.apk"
          if-no-files-found: error
