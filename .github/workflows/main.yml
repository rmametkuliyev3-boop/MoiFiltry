name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find project root
        run: |
          set -e

          echo "Ищем корень Android-проекта..."

          PROJECT_ROOT=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ОШИБКА: settings.gradle или settings.gradle.kts не найден!"
            echo "Структура репозитория:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Корень проекта найден:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Проверяем структуру проекта..."

          test -f settings.gradle -o -f settings.gradle.kts
          test -f build.gradle -o -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle -o -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html

          echo "Структура проекта OK"

      - name: Verify delete and call
        run: |
          set -e

          cd "$PROJECT_ROOT"

          grep -q "function deleteClient" app/src/main/assets/index.html
          grep -q "db.clients.splice" app/src/main/assets/index.html
          grep -q "function callClient" app/src/main/assets/index.html
          grep -q "public void call" app/src/main/java/kz/moifiltry/app/MainActivity.java
          grep -q "ACTION_DIAL" app/src/main/java/kz/moifiltry/app/MainActivity.java

          echo "Удаление и звонок OK"

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --no-daemon
          else
            gradle clean assembleDebug --stacktrace --no-daemon
          fi

      - name: Check APK
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
