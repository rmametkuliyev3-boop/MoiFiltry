name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Сборка Мои Фильтры 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Проверить структуру
        run: |
          set -e
          echo "Проверяем структуру..."

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW=$(find . -type f -name "gradlew" -print -quit)
            if [ -z "$GRADLEW" ]; then
              echo "gradlew не найден"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          echo "Проект: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle не найден"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Структура проверена."

      - name: Собрать APK
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW=$(find . -type f -name "gradlew" -print -quit)
            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Проверить APK
        run: |
          set -e

          APK=$(find . -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK не найден"
            exit 1
          fi

          echo "APK найден: $APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: "**/*.apk"
          if-no-files-found: error
