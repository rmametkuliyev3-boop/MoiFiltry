name: Build MoiFiltry APK 15

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project
        run: |
          set -e
          echo "Ищем Android-проект..."
          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            DIR="$(dirname "$settings_file")"
            if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*")

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -name 'MoiFiltry_*.zip' -not -path './.git/*' | sort | tail -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ОШИБКА: Android-проект и ZIP не найдены"
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            echo "Распаковываем: $ZIP_FILE"
            rm -rf buildsrc
            mkdir -p buildsrc
            unzip -q "$ZIP_FILE" -d buildsrc

            while IFS= read -r settings_file; do
              DIR="$(dirname "$settings_file")"
              if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(find buildsrc -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path '*/.git/*')
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: Android-проект не найден даже после распаковки"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "Android-проект: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project and phone logic
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          grep -Fq "kz.moifiltry.app.v63" app/build.gradle
          grep -Fq "versionCode 12" app/build.gradle
          grep -Fq "versionName '6.4'" app/build.gradle

          grep -Fq "function phoneDigits" app/src/main/assets/index.html
          grep -Fq "serviceNextDate" app/src/main/assets/index.html
          grep -Fq "replace:get('serviceNextDate')?.value||''" app/src/main/assets/index.html
          grep -Fq "Android.call(p)" app/src/main/assets/index.html
          grep -Fq "Android.whatsapp('7'+p.slice(1))" app/src/main/assets/index.html

          ! grep -Fq '<span>+7</span>' app/src/main/assets/index.html
          ! grep -Fq "get('replace').value" app/src/main/assets/index.html

          echo "Проверка проекта и телефона OK"

      - name: Build single APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          APK_COUNT=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' | wc -l)

          test "$APK_COUNT" -eq 1

          ls -lh "$APK"

          echo "Один APK успешно создан"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-15-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
