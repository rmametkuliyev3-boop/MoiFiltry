name: Build MoiFiltry 5.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/kz/moifiltry/app/MainActivity.java
          test -f app/src/main/assets/index.html
          echo "Project structure: OK"

      - name: Verify app logic and cartridge order
        shell: bash
        run: |
          set -euo pipefail
          HTML="app/src/main/assets/index.html"
          JAVA="app/src/main/java/kz/moifiltry/app/MainActivity.java"

          grep -Fq "function deleteClient" "$HTML"
          grep -Fq "function saveService" "$HTML"
          grep -Fq "function historyHtml" "$HTML"
          grep -Fq "function shareHistory" "$HTML"
          grep -Fq "function callClient" "$HTML"
          grep -Fq "function completeTask" "$HTML"

          grep -Fq "const cartridges=['PP5','GAC','CTO','PP1','Пост-фильтр','Минерализатор','RO-мембрана'];" "$HTML"
          grep -Fq "const models=['Ecosoft с насосом','Ecosoft без насоса','FitAqua'];" "$HTML"

          grep -Fq "Дата установки" "$HTML"
          grep -Fq "Дата следующей замены" "$HTML"
          grep -Fq "История обслуживания" "$HTML"
          grep -Fq "Резервная копия" "$HTML"

          grep -Fq "ACTION_DIAL" "$JAVA"
          grep -Fq "shareWhatsApp" "$JAVA"

          if grep -niE 'склад|inventory|stockObj|changeStock|deductCartridges|addBack|cartridgesAvailable' "$HTML" "$JAVA"; then
            echo "ERROR: inventory/stock code found in application files."
            exit 1
          fi

          echo "Required logic, models, cartridge order and no inventory code: OK"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)

          if not scripts:
              raise SystemExit('ERROR: no JavaScript block found')

          Path('/tmp/moifiltry.js').write_text(
              '\n'.join(scripts),
              encoding='utf-8'
          )
          PY

          node --check /tmp/moifiltry.js
          echo "JavaScript syntax: OK"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -gt 1000

          file "$APK"

          echo "APK exists and is non-empty: $SIZE bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry-5.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
