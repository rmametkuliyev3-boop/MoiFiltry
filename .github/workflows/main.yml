name: Build MyFilter 3 5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MyFilter 3 5.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack project ZIP and find Android root
        shell: bash
        run: |
          set -euo pipefail

          echo "Ищем ZIP проекта..."

          ZIP_FILE=""

          if [ -f "MyFilter 3 5 Final UI History fixed.zip" ]; then
            ZIP_FILE="MyFilter 3 5 Final UI History fixed.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f \
              \( -iname "*Final*UI*History*fixed*.zip" \
              -o -iname "MoiFiltry_5_1_FIXED_FINAL.zip" \) \
              -print -quit)
          fi

          if [ -z "${ZIP_FILE}" ]; then
            echo "ОШИБКА: ZIP проекта не найден."
            exit 1
          fi

          echo "Найден ZIP: ${ZIP_FILE}"

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "${ZIP_FILE}" -d extracted-project

          echo "ZIP распакован."

          SETTINGS_FILE=$(find extracted-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "${SETTINGS_FILE}" ]; then
            echo "ОШИБКА: settings.gradle или settings.gradle.kts не найден."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "${SETTINGS_FILE}")

          echo "Найден корень Android-проекта:"
          echo "${PROJECT_ROOT}"

          PROJECT_ROOT="$(cd "${PROJECT_ROOT}" && pwd)"

          echo "PROJECT_ROOT=${PROJECT_ROOT}" >> "$GITHUB_ENV"

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_ROOT}"

          echo "Проверяем корень проекта:"
          pwd

          if [ -f "settings.gradle" ]; then
            echo "OK: settings.gradle"
          elif [ -f "settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ОШИБКА: settings.gradle/settings.gradle.kts не найден."
            exit 1
          fi

          test -f "build.gradle" || {
            echo "ОШИБКА: build.gradle не найден."
            exit 1
          }

          test -f "gradle.properties" || {
            echo "ОШИБКА: gradle.properties не найден."
            exit 1
          }

          test -d "app" || {
            echo "ОШИБКА: папка app не найдена."
            exit 1
          }

          test -f "app/src/main/AndroidManifest.xml" || {
            echo "ОШИБКА: AndroidManifest.xml не найден."
            exit 1
          }

          test -f "app/src/main/java/kz/moifiltry/app/MainActivity.java" || {
            echo "ОШИБКА: MainActivity.java не найден."
            exit 1
          }

          test -f "app/src/main/assets/index.html" || {
            echo "ОШИБКА: index.html не найден."
            exit 1
          }

          echo ""
          echo "======================================"
          echo "СТРУКТУРА ANDROID-ПРОЕКТА OK"
          echo "======================================"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_ROOT}"

          echo "Запускаем сборку assembleDebug..."

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Check Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${PROJECT_ROOT}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${APK}" ]; then
            echo "ОШИБКА: app-debug.apk не найден."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${APK}")

          if [ "${APK_SIZE}" -le 0 ]; then
            echo "ОШИБКА: APK имеет размер 0 байт."
            exit 1
          fi

          echo "APK найден:"
          echo "${APK}"

          echo "Размер APK: ${APK_SIZE} байт"

          echo ""
          echo "======================================"
          echo "APK ПРОВЕРЕН И ИМЕЕТ НЕНУЛЕВОЙ РАЗМЕР"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFilter 3 5.1 APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
