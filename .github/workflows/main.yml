name: Build MoiFiltry 01

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MoiFiltry 01
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        run: |
          set -e

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Project files OK"

          grep -Eq "applicationId[[:space:]]+['\"]kz\.moifiltry\.app\.v67['\"]" app/build.gradle
          grep -Eq "versionCode[[:space:]]+19" app/build.gradle
          grep -Eq "versionName[[:space:]]+['\"]6\.7['\"]" app/build.gradle

          echo "Application version OK"

          grep -Fq 'serviceHistoryList' app/src/main/assets/index.html
          grep -Fq 'returnToClientCard' app/src/main/assets/index.html
          grep -Fq 'function handleAndroidBack' app/src/main/assets/index.html
          grep -Fq 'function financeHome' app/src/main/assets/index.html
          grep -Fq 'function financeOverview' app/src/main/assets/index.html
          grep -Fq 'function financeStatistics' app/src/main/assets/index.html
          grep -Fq 'function financeHistory' app/src/main/assets/index.html

          echo "Core functions OK"

      - name: Build single APK
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk

          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/MoiFiltry_01.apk

          rm app/build/outputs/apk/debug/app-debug.apk

          test -f app/build/outputs/apk/debug/MoiFiltry_01.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiFiltry_01
          path: app/build/outputs/apk/debug/MoiFiltry_01.apk
          if-no-files-found: error
